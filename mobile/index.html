/* ===== 60-squircle-apply.js ===== */
/* ==========================================================================
   squircle-apply.js — 连续圆角（超椭圆）落地到真实界面
   --------------------------------------------------------------------------
   【苹果那种圆角】
   Continuous Corners，中文「连续圆角」，基础是 Squircle 超椭圆，n≈5。
   和普通 border-radius 的差别在**曲率连续**：
     普通圆角 = 直线段 + 圆弧段在切点硬接，曲率从 0 突变成 1/r → 有接缝
     连续圆角 = 曲率从 0 平滑升到峰值再回0，全程无跳变

   【本版方案：填充层 + 描边 overlay，两层各司其职】
   走过的弯路（别再走）：
     1) clip-path 裁形状 → 会把 border 外半圈切掉，弯角线宽变细
     2) border 加倍补 → 挤掉 padding，布局变形
     3) background-image 画「描边环」+ background-origin:border-box
        → 实测在 2.5px 描边下描边环整体错位、在圆角处裁断，
          4 倍放大看是断成黑杠（padding-box 比 border-box 窄 2×2.5px）
   现在用的：元素本身只负责**填充**（background-color / background-image 原样不动），
   插一个 overlay 子元素专门画**描边**，用 `inset:0` + `center/100% 100%` 定位。
   描边和填充各自独立，互不干扰，也不需要任何偏移补偿。

   【降级】
   浏览器不支持 SVG background 或 JS 出错时 → 元素保留原生 border-radius，
   界面照常可用（只是圆角不是连续的）。
   ========================================================================== */

(function () {
  'use strict';

  /* 需要升级的元素：凡是「有描边 + 有圆角」的容器。
       【已剔除】下面这些显式写了 border:0，本身就不该有描边：
         .srow-more / .pp-ico / .pp-act / .searchbox input / .sec-more / .sitem / .sr
       判断标准：这个选择器会不会和「带描边的组件」挂在同一元素上。
       —— .card-btn 就是反例，它是修饰类，`border:0` 把 .card 的描边整个覆盖掉，
          导致入口卡/歌单卡完全没描边（这个问题已经修掉）。
       【动态渲染的卡片】用 [data-sq-r] 手动标记。 */
  var SEL = [
    '.card', '.mini', '.tabbar', '.tab', '.chip', '.btn', '.ibtn',
    '.searchbox', '.sec-btn', '.sheet', '.pp-disc',
    '.ent-cover', '.ent-play', '.srow-cover',
    '.toast', '.swatch', '.pl-card', '.hist-chip',
    '.cnt', '.dot', '.spinner', '.mini-cover'
  ].join(',');

  var OVERLAY = 'sq-line';      /* 描边层的类名 */
  var SVGNS = 'http://www.w3.org/2000/svg';

  function svgURI(svg) {
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27') + '")';
  }

  /* 生成描边 SVG —— 主描边 + 内侧复线，两条都用同一条超椭圆路径。
     【为什么复线必须在这里画，不能用 CSS ::before】
     原来的双线叠画是 `::before { inset:3px; border-radius:15px; transform:rotate(.5deg) }` ——
     那是**普通圆角 + 旋转**，和主描边的超椭圆形状对不上，
     旋转后四角还会伸出/缩进主描边 → 卡片右上右下出现缺口。
     现在两条线共用同一条超椭圆数据：
       主描边 = 超椭圆(w, h, r)
       复线   = 超椭圆(w-2*gap, h-2*gap, r-gap)，只偏移不旋转
     形状完全贴合，不可能出现缺口。
     --line-double=0 时复线不画（设置里的「双实线边框」开关）。 */
  function strokeSVG(w, h, r, sw, ink, double) {
    var SQ = window.SQ;
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '"' +
      ' viewBox="0 0 ' + w + ' ' + h + '">';
    svg += '<path d="' + SQ.path(w, h, r, SQ.N) + '" fill="none" stroke="' + ink +
           '" stroke-width="' + sw + '" stroke-linejoin="round"/>';
    if (double) {
      var gap = 3 + sw / 2;              /* 主描边内侧再让开一点 */
      var iw = w - gap * 2, ih = h - gap * 2;
      if (iw > 4 && ih > 4) {
        svg += '<path d="' + SQ.path(iw, ih, Math.max(0, r - gap), SQ.N) + '" fill="none"' +
               ' stroke="' + ink + '" stroke-width="' + (sw * 0.5) +
               '" stroke-linejoin="round" opacity="0.3"' +
               ' transform="translate(' + gap + ' ' + gap + ')"/>';
      }
    }
    return svgURI(svg + '</svg>');
  }

  /* 单/双线开关：读 --line-double（设置 → 外观 → 「双实线边框」）。
     getComputedStyle 读变量在老 WebView 可能失败 → try/catch 兜住，失败按开处理。 */
  function doubleOn() {
    try {
      var v = getComputedStyle(document.documentElement)
        .getPropertyValue('--line-double').trim();
      return v !== '0';
    } catch (e) { return true; }
  }

  function radiusOf(el, cs) {
    var ex = el.getAttribute && el.getAttribute('data-sq-r');
    if (ex) return parseFloat(ex);

    var r = cs.borderTopLeftRadius || '0px';
    if (/%/.test(r)) {
      var rect = el.getBoundingClientRect();
      var base = parseFloat(r);
      return isNaN(base) ? 0 : Math.min(rect.width, rect.height) * base / 100;
    }
    var m = /(-?[\d.]+)px/.exec(r);
    return m ? parseFloat(m[1]) : 0;
  }

  function applyOne(el) {
    if (!el || el.nodeType !== 1) return false;
    if (el.hasAttribute && el.hasAttribute('data-sq')) return false;
    if (el.tagName && String(el.tagName).toLowerCase() === 'svg') return false;

    var rect = el.getBoundingClientRect();
    if (rect.width < 4 || rect.height < 4) return false;

    var cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden') return false;

    /* 【关键】只在「确实有描边」时才接管。
       border:0 的元素（图标钮/输入框）读到 sw=0，直接跳过，
       让它们保持透明无框——否则会凭空多出一圈线。 */
    var sw = parseFloat(cs.borderTopWidth) || 0;
    if (sw <= 0) return false;

    var radius = radiusOf(el, cs);
    if (!radius || radius < 3) return false;

    var w = Math.round(rect.width);
    var h = Math.round(rect.height);
    radius = Math.min(radius, w / 2, h / 2);

    var ink = cs.borderTopColor;
    if (!ink || ink === 'rgba(0, 0, 0, 0)' || ink === 'transparent') ink = 'currentColor';

    /* 【必须 inset:-sw，这是实测踩到的坑】
       overlay 是子元素，position:absolute + inset:0 定位到的是
       **padding box**，而父元素有 2.5px 的 border →
       实测父元素 436×46，overlay 只有 431×41，正好差 2×2.5px。
       描边因此画在padding box 上，比元素边界内缩一圈，圆角处就错位。
       用 inset:-sw 向外补回 border 宽度，overlay 尺寸就和元素 border-box 完全一致。
       SVG 的width/height 也按 border-box 尺寸（即 rect.width）生成。 */
    var line = document.createElement('i');
    line.className = OVERLAY;
    line.setAttribute('aria-hidden', 'true');
    line.style.cssText =
      'position:absolute;inset:' + (-sw) + 'px;pointer-events:none;z-index:2;' +
      'background:' + strokeSVG(w, h, radius, sw, ink, doubleOn()) +
      ' center/' + w + 'px ' + h + 'px no-repeat';

    /* 原生 border 宽度保留（它还要参与布局计算），只把颜色去掉，
       视觉交给 overlay —— 这样盒子尺寸、padding 全部零变化。 */
    el.style.borderTopColor = 'transparent';
    el.style.borderRightColor = 'transparent';
    el.style.borderBottomColor = 'transparent';
    el.style.borderLeftColor = 'transparent';

    el.appendChild(line);
    el.setAttribute('data-sq', '1');
    return true;
  }

  function applyAll(root) {
    var scope = root || document;
    var list;
    try { list = scope.querySelectorAll(SEL + ',[data-sq-r]'); }
    catch (e) { return 0; }
    var n = 0;
    for (var i = 0; i < list.length; i++) {
      if (applyOne(list[i])) n++;
    }
    return n;
  }

  /* 撤销：移除 overlay、恢复 border 颜色 */
  function reset() {
    var lines = document.querySelectorAll('.' + OVERLAY);
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].parentNode) lines[i].parentNode.removeChild(lines[i]);
    }
    var done = document.querySelectorAll('[data-sq]');
    for (var j = 0; j < done.length; j++) {
      done[j].removeAttribute('data-sq');
      done[j].style.borderTopColor = '';
      done[j].style.borderRightColor = '';
      done[j].style.borderBottomColor = '';
      done[j].style.borderLeftColor = '';
    }
  }

  function reapply() { reset(); applyAll(); }

  var api = {
    apply: applyOne,
    applyAll: applyAll,
    reset: reset,
    reapply: reapply
  };

  /* ======================================================================
     自动兜底：界面是动态渲染的（歌单/歌曲行/弹层随时插入），
     逐个渲染函数手动调 applyAll 一定会漏 → 用观察器统一处理。
     ====================================================================== */
  function schedule() {
    if (api.__pending) return;
    api.__pending = true;
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    raf(function () {
      api.__pending = false;
      api.__running = true;
      applyAll();
      setTimeout(function () { api.__running = false; }, 0);
    });
  }

  if (window.MutationObserver) {
    var mo = new MutationObserver(function (records) {
      /* overlay 是自己插的，会再次触发观察器 → 必须排除，否则死循环 */
      var selfCaused = true;
      for (var i = 0; i < records.length; i++) {
        var added = records[i].addedNodes;
        var allOurs = added.length > 0;
        for (var j = 0; j < added.length; j++) {
          var n = added[j];
          if (!n.nodeType) { allOurs = false; break; }
          if (!(n.nodeType === 1 && n.classList && n.classList.contains(OVERLAY))) {
            allOurs = false; break;
          }
        }
        if (!allOurs) { selfCaused = false; break; }
      }
      if (selfCaused || api.__running) return;
      schedule();
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    api.__mo = mo;
  }

  /* 尺寸变化：旋转屏幕、字号缩放、播放页封面开合 */
  if (window.ResizeObserver) {
    var lastW = 0, lastH = 0, timer = 0;
    var raf2 = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    var ro = new ResizeObserver(function (entries) {
      var r = entries[0].contentRect;
      if (Math.abs(r.width - lastW) < 1 && Math.abs(r.height - lastH) < 1) return;
      lastW = r.width; lastH = r.height;
      clearTimeout(timer);
      timer = setTimeout(reapply, 90);
    });
    ro.observe(document.documentElement);
    api.__ro = ro;
  }

  window.SQApply = api;
  if (window.CN) CN.sq = api;

  /* 皮肤切换会改描边颜色，必须重算，否则描边还留在旧颜色上 */
  document.addEventListener('skinchange', function () {
    setTimeout(reapply, 30);
  });
  window.addEventListener('resize', function () {
    clearTimeout(api.__rt);
    api.__rt = setTimeout(reapply, 160);
  });
})();

/* ===== 70-regions.js ===== */
/* ==========================================================================
   70-regions.js — 区域标注（A 区 / B 区 / C 区 …）
   --------------------------------------------------------------------------
   【为什么需要】
   反馈问题时用「哪个小窗口」指代太模糊 ——
   「快捷栏左边那个」「播放框下面一点」经常对不上号。
   打开标注后，每个主要区域左上角会出现一个字母牌，
   截图里直接写「B 区有个问题」，定位零歧义。

   【怎么用】
   · 开关在测试面板 → 「显示 A/B 区标注」
   · 切视图 / 弹层打开时会自动重新标注
   · 标注牌是半透明红底白字，不吃点击，不影响任何操作
   ========================================================================== */

(function () {
  'use strict';

  var CN = window.CN;

  /* 区域定义：选择器 → 区域名
     顺序即标注顺序（每个视图内从 A 开始）
     选择器全部对照 index.html 核实过，别名不存在的会静默跳过

     浮层类（弹层/提示条）单列在FLOATS —— 它们是 fixed 定位，
     即使没打开也可能量到尺寸，必须靠「实际可见」过滤，
     所以统一放最后，需要时单独用 checkVisible 严格判。 */
  var MAP = [
    /* 首页 */
    ['.topbar',        '顶栏'],
    ['#homeNow',       '正在播放卡'],
    ['#homeGrid',      '入口网格'],
    ['#plGrid',        '歌单墙'],
    ['#mini',          '播放小框'],
    ['#tabbar',        '快捷栏'],
    /* 搜索 */
    ['.searchbox',     '搜索框'],
    ['#searchBanner',  '搜索横幅'],
    ['#histSec',       '历史区'],
    ['#searchBody',    '搜索结果区'],
    /* 导入 */
    ['#importBanner',  '导入横幅'],
    ['#impInput',      '输入框'],
    /* 我的 */
    ['#secSet',        '外观分区'],
    ['#setRows',       '外观设置'],
    ['#playRows',      '播放设置'],
    ['#aboutRows',     '关于'],
    /* 列表 */
    ['#listTitle',     '列表标题'],
    ['#songList',      '歌曲列表'],
    ['#songFoot',      '列表底栏'],
    /* 播放页 */
    ['.pp-head',       '播放页顶栏'],
    ['.pp-disc',       '播放页封面'],
    ['.pp-lyricbox',   '歌词区'],
    ['.pp-info',       '歌曲信息'],
    ['.pp-prog',       '进度条'],
    ['.pp-ctl',        '控制区'],
    ['.pp-acts',       '动作行'],
    /* 浮层 */
    ['.sheet',         '弹层'],
    ['.toast',         '提示条']
  ];

  /* 判定「真实打开」的浮层：容器有 open 类或自身可见 */
  var FLOATS = ['.sheet', '.toast'];

  function isFloatOpen(sel, el) {
    if (sel === '.sheet') return el.classList.contains('open') ||
                                   el.getAttribute('aria-hidden') !== 'true';
    if (sel === '.toast') return el.classList.contains('show') ||
                                   el.textContent.trim() !== '';
    return true;
  }

  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var layer = null;

  function ensureLayer() {
    if (layer && layer.parentNode) return layer;
    layer = document.createElement('div');
    layer.id = '__region_layer__';
    layer.setAttribute('aria-hidden', 'true');
    layer.style.cssText =
      'position:fixed;left:0;top:0;width:0;height:0;overflow:visible;' +
      'pointer-events:none;z-index:2147483646';
    document.body.appendChild(layer);
    return layer;
  }

  function clear() {
    if (!layer) return;
    while (layer.firstChild) layer.removeChild(layer.firstChild);
  }

  function paint() {
    /* 开关状态挂在 CN.regionOn 上，不在 CN.S 里 —— 判断错了会导致永远不画 */
    if (!CN || !CN.regionOn) { clear(); return; }
    var l = ensureLayer();
    clear();

    var i = 0;
    for (var k = 0; k < MAP.length; k++) {
      var sel = MAP[k][0];
      var name = MAP[k][1];
      var el;
      try { el = document.querySelector(sel); } catch (e) { continue; }
      if (!el) continue;
      if (FLOATS.indexOf(sel) >= 0 && !isFloatOpen(sel, el)) continue;

      var r = el.getBoundingClientRect();
      if (r.width < 8 || r.height < 8) continue;          /* 隐藏 / 未渲染 */

      /* 【必须查 visibility】
         5 个视图都常驻 DOM，切走时只加 visibility:hidden（不设 display:none），
         只判断 display 会把「当前视图之外的区块」也标出来，
         结果一堆字母牌堆在屏幕底部。 */
      var cs = getComputedStyle(el);
      if (cs.visibility === 'hidden' || cs.opacity === '0') continue;

      /* 祖先里有 visibility:hidden 的话，子元素 computed 也会是 hidden，
         上一步已经拦住；这里再挡一道「不在当前视图内」的：
         元素中心点必须在视口内 */
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      if (cy < 0 || cy > window.innerHeight) continue;
      if (cx < 0 || cx > window.innerWidth) continue;

      var box = document.createElement('div');
      box.style.cssText =
        'position:absolute;left:' + Math.round(r.left) + 'px;top:' + Math.round(r.top) + 'px;' +
        'display:flex;align-items:center;gap:4px;' +
        'background:rgba(224,32,42,.92);color:#fff;border:1.5px solid #fff;' +
        'border-radius:4px;padding:2px 7px;font:700 11px/1.3 -apple-system,sans-serif;' +
        'white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)';
      box.textContent = LETTERS[i % 26] + ' 区 · ' + name;

      /* 从左上角稍微内缩，避免压住描边 */
      l.appendChild(box);
      i++;
    }
  }

  /* ------------------------------------------------------------------
     挂在 CN 上：CN.regionOn = true 打开，false 关闭
     CN.setRegion(true) 返回 true（已开启），调用方可用返回值刷按钮文字
     ------------------------------------------------------------------ */
  if (CN) {
    CN.regionOn = false;
    CN.setRegion = function (on) {
      CN.regionOn = !!on;
      setTimeout(paint, 30);
      return CN.regionOn;
    };
    CN.repaintRegion = paint;
  }

  /* 视图切换、弹层开合、列表渲染后自动重绘 */
  var raf = 0;
  function schedule() {
    if (!CN || !CN.regionOn) return;
    if (raf) return;
    raf = (window.requestAnimationFrame || function (f) { return setTimeout(f, 30); })(function () {
      raf = 0;
      paint();
    });
  }

  if (window.MutationObserver) {
    var mo = new MutationObserver(schedule);
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
  window.addEventListener('scroll', schedule, true);
  document.addEventListener('scroll', schedule, true);
  window.addEventListener('resize', schedule);

  /* 切换视图后延一点再画，等动画结束、元素尺寸稳定 */
  var oldGo = CN && CN.go;
  if (CN && oldGo) {
    CN.go = function (view, back) {
      var r = oldGo.apply(this, arguments);
      schedule();
      setTimeout(paint, 320);
      return r;
    };
  }

  /* 弹层 / 播放页开合 */
  ['openSheet', 'closeSheet', 'openPlayer', 'closePlayer'].forEach(function (fn) {
    if (!CN || typeof CN[fn] !== 'function') return;
    var orig = CN[fn];
    CN[fn] = function () {
      var r = orig.apply(this, arguments);
      schedule();
      setTimeout(paint, 340);
      return r;
    };
  });

})();

/* ===== 90-boot.js ===== */
/* ==========================================================================
   椰子音乐 4 · 90-boot.js
   启动 / 事件绑定 / 自检
   --------------------------------------------------------------------------
   旧版 app.js:2136 有个 auditBindings() 自检（查出 6 处死绑定）。
   本版保留这个机制，并把它放在启动末尾跑。
   ========================================================================== */

(function () {
  'use strict';

  /* ==========================================================================
     一、事件绑定
     ========================================================================== */

  /* ---------- Tab 栏 ---------- */
  CN.delegate('tabbar', '.tab', 'click', function (e, t) {
    var v = t.dataset.view;
    if (v === 'fav')      CN.openList({ kind: 'fav', title: '我喜欢的音乐' });
    else if (v === 'search')   { CN.go('search'); CN.renderHistChips(); }
    else CN.go(v);
  });

  /* ---------- 顶栏 ---------- */
  CN.on('themeBtn', 'click', function () {
    /* 深浅色快切：在浅色系和深色系之间跳 */
    var cur = CN.settings.skin;
    var light = ['paper', 'pen'].indexOf(cur) >= 0;
    CN.settings.skin = light ? 'dark' : 'paper';
    CN.api.setSetting('skin', CN.settings.skin);
    CN.applySettings();
    CN.toast(CN.settings.skin === 'dark' ? '深色纸' : '米白纸');
  });
  CN.on('setBtn', 'click', function () { CN.go('settings'); });

  /* ---------- 全局搜索 ---------- */
  CN.on('searchInput', 'input', CN.debounce(function (e) {
    var kw = (e.target.value || '').trim();
    if (!kw) return;
    if (CN.S.view !== 'search') CN.go('search');
    CN.runSearch(kw, CN.S.view === 'search' && CN.S.kw === kw);
  }, 450));
  CN.on('searchInput', 'keydown', function (e) {
    if (e.key !== 'Enter') return;
    var kw = (e.target.value || '').trim();
    if (kw) { e.target.blur(); CN.runSearch(kw, false); }
  });

  /* ---------- 首页 ---------- */
  CN.delegate('homeGrid', '[data-go]', 'click', function (e, t) {
    CN.openSection(t.dataset.go);
  });
  CN.delegate('plGrid', '[data-pl]', 'click', function (e, t) {
    CN.openPlaylist(t.dataset.pl);
  });
  CN.on('addPlBtn', 'click', function () { CN.newPlaylistSheet(null); });
  CN.on('homeNowPlay', 'click', function (e) {
    e.stopPropagation();
    CN.toggle();
  });
  CN.on('homeNow', 'click', function () { CN.openPlayer(); });

  /* ---------- 搜索页 ---------- */
  CN.delegate('histChips', '[data-kw]', 'click', function (e, t) {
    CN.$('searchInput').value = t.dataset.kw;
    CN.runSearch(t.dataset.kw, false);
  });
  CN.on('histClear', 'click', function () { CN.clearHist(); CN.toast('已清空'); });

  /* ---------- 列表页 ---------- */
  CN.delegate('songList', '.srow', 'click', function (e, t) {
    if (e.target.closest('[data-more]')) return;
    var i = Number(t.dataset.i);
    CN.setQueue(CN.S.songs, i);
  });
  CN.delegate('songList', '[data-more]', 'click', function (e, t) {
    e.stopPropagation();
    var i = Number(t.dataset.more);
    CN.openSongSheet(CN.S.songs[i], i);
  });
  CN.longPress(CN.$('songList'), function () {
    if (CN.S.listKind === 'playlist' && CN.S.listId) CN.openPlaylistOps(CN.S.listId);
  });
  CN.on('listPlayAll', 'click', function () {
    if (CN.S.songs.length) CN.setQueue(CN.S.songs, 0);
    else CN.toast('列表是空的');
  });
  CN.on('listMore', 'click', function () {
    if (CN.S.listKind === 'playlist' && CN.S.listId) CN.openPlaylistOps(CN.S.listId);
    else CN.toast('这个列表不能操作');
  });

  /* ---------- 导入页 ---------- */
  CN.on('impBtn', 'click', CN.doImport);
  CN.on('impInput', 'keydown', function (e) {
    if (e.key === 'Enter') { e.target.blur(); CN.doImport(); }
  });
  CN.on('pickTxtBtn', 'click', function () { CN.api.pickTxtFile(); });

  /* ---------- 我的页 ---------- */
  CN.on('loginBtn', 'click', function (e) {
    e.stopPropagation();
    if (CN.S.login.logged_in) {
      CN.api.logout();
      setTimeout(function () { CN.refreshLogin(); CN.renderHome(); CN.toast('已退出'); }, 400);
    } else {
      CN.api.openLogin();
    }
  });

  /* ---------- MiniPlayer ---------- */
  CN.on('mini', 'click', function () { CN.openPlayer(); });
  CN.on('miniPlay', 'click', function (e) { e.stopPropagation(); CN.toggle(); });
  CN.on('miniFav', 'click', function (e) { e.stopPropagation(); CN.favTap(); });
  CN.on('mini', 'keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); CN.openPlayer(); }
  });

  /* ---------- 播放页 ---------- */
  CN.on('ppDown', 'click', CN.closePlayer);
  CN.on('ppPlay', 'click', CN.toggle);
  CN.on('ppPrev', 'click', CN.prev);
  CN.on('ppNext', 'click', CN.next);
  CN.on('ppMode', 'click', CN.nextMode);
  CN.on('ppFav', 'click', CN.favTap);
  CN.on('ppDownload', 'click', function () {
    if (!CN.S.track) { CN.toast('还没有在播放的歌曲'); return; }
    CN.api.download(CN.S.track);
    CN.toast('已加入下载队列');
  });
  CN.on('ppAdd', 'click', function () {
    if (!CN.S.track) { CN.toast('还没有在播放的歌曲'); return; }
    CN.openPickSheet(CN.S.track);
  });
  CN.on('ppLoud', 'click', function () {
    CN.setLoud(!CN.S.loud);
    CN.toast(CN.S.loud ? '响度均衡已开' : '响度均衡已关');
  });
  CN.on('ppSwap', 'click', function () {
    if (!CN.S.track) { CN.toast('还没有在播放的歌曲'); return; }
    CN.openSwapSheet(CN.S.track);
  });
  CN.on('ppQueue', 'click', CN.openQueueSheet);

  /* 进度拖拽：限频刷新，松手才 tell 原生 */
  var track = CN.$('ppTrack');
  var dragging = false;
  var ratioAt = function (e) {
    var r = track.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return CN.clamp(x / r.width, 0, 1);
  };
  track.addEventListener('touchstart', function (e) {
    dragging = true; track.classList.add('dragging');
    CN.seekByRatio(ratioAt(e)); e.preventDefault();
  }, { passive: false });
  track.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    CN.seekByRatio(ratioAt(e)); e.preventDefault();
  }, { passive: false });
  track.addEventListener('touchend', function () {
    dragging = false; track.classList.remove('dragging');
  });
  track.addEventListener('mousedown', function (e) {
    dragging = true; track.classList.add('dragging');
    CN.seekByRatio(ratioAt(e)); e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) { if (dragging) CN.seekByRatio(ratioAt(e)); });
  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false; track.classList.remove('dragging');
  });
  /* 键盘可达 */
  track.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { CN.seek(CN.S.cur + 5); CN.paintProgress(); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { CN.seek(CN.S.cur - 5); CN.paintProgress(); e.preventDefault(); }
  });

  /* ---------- Sheet ---------- */
  CN.on('sheetClose', 'click', CN.closeSheet);

  /* ---------- 设置页分区按钮：点标题展开/收起 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.sec-btn[data-sec]'), function (b) {
    b.addEventListener('click', function () {
      var key = b.dataset.sec;
      var body = CN.$('sec' + key.charAt(0).toUpperCase() + key.slice(1));
      if (!body) return;
      var open = body.classList.toggle('open');
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });

  CN.on('scrim', 'click', function () {
    if (CN.S.ppageOpen) CN.closePlayer();
    else CN.closeSheet();
  });

  /* Sheet 下拉关闭 */
  (function () {
    var sh = CN.$('sheet');
    var grab = CN.$('sheetGrab');
    var sy = 0, dy = 0, drag = false;
    grab.addEventListener('touchstart', function (e) {
      sy = e.touches[0].clientY; dy = 0; drag = true;
    }, { passive: true });
    grab.addEventListener('touchmove', function (e) {
      if (!drag) return;
      dy = Math.max(0, e.touches[0].clientY - sy);
      sh.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    grab.addEventListener('touchend', function () {
      if (!drag) return;
      drag = false;
      sh.style.transform = '';
      if (dy > 80) CN.closeSheet();
    });
  })();

  /* ==========================================================================
     二、启动
     ========================================================================== */
  function boot() {
    CN.loadSettings();

    /* 恢复队列与收藏 */
    try {
      var favs = CN.api.getFavorites() || [];
      favs.forEach(function (s) { if (s.bvid) CN.S.favs.add(s.bvid); });
    } catch (e) {}

    var q = CN.api.getQueue();
    if (q && q.length) { CN.S.queue = q; CN.S.qIndex = q.length - 1; }

    CN.renderHome();
    CN.renderHistChips();
    CN.syncTab();
    CN.syncTop();
    CN.paint();

    /* 收藏状态回填 */
    CN.paintFav();

    /* 剪贴板检测（延迟，别挡启动）*/
    setTimeout(function () {
      if (CN.S.view === 'import') CN.checkClipboard();
    }, 900);

    /* 浏览器预览提示 */
    if (!CN.N.has('playQueue')) {
      console.info('[椰子音乐] 未检测到原生环境，进入浏览器预览模式：资料库可用，播放需在 App 内');
    }

    /* 漏绑自检 —— 旧版查过 6 处死绑定 */
    auditBindings();
  }

  /* ==========================================================================
     三、漏绑自检
     有 id 但从没绑过事件的元素 → 报出来（多半是死 UI）
     ========================================================================== */
  function auditBindings() {
    var ids = [
      'themeBtn', 'setBtn', 'searchInput',
      'addPlBtn', 'homeNowPlay', 'homeNow',
      'histClear', 'listPlayAll', 'listMore', 'songList',
      'impBtn', 'impInput', 'pickTxtFile'.replace('pickTxtFile', 'pickTxtBtn'),
      'loginBtn', 'userCard',
      'mini', 'miniPlay', 'miniFav',
      'ppDown', 'ppPlay', 'ppPrev', 'ppNext', 'ppMode', 'ppFav',
      'ppDownload', 'ppAdd', 'ppLoud', 'ppSwap', 'ppQueue', 'ppTrack',
      'sheetClose', 'sheetGrab', 'scrim',
    ];
    var dead = [];
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) { dead.push(id + '(不存在)'); return; }
      if (!el.__bound && !el.__dg) dead.push(id);
    });
    if (dead.length && window.console) {
      console.warn('[自检] 这些 id 没有绑定事件：', dead.join(', '));
    }
  }

  /* DOM 就绪后启动 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();


/* ===== squircle.js ===== */
/* ==========================================================================
   squircle.js — 连续圆角（超椭圆）路径生成
   --------------------------------------------------------------------------
   【要解决的问题】
   普通 border-radius 是「直线段 + 圆弧段」在切点硬接，
   曲率从 0 突变成 1/r，视觉上有一道接缝（用户说的「拼接感」）。
   苹果的 Continuous Corners 用超椭圆过渡，曲率连续，所以没有接缝。

   【几何】
   矩形四边仍是直线，只在四个角把「圆弧」换成「超椭圆弧」。
   曲率从 0 平滑升到峰值再平滑回 0，没有跳变。

   【关键：路径必须一笔走完】
   顺时针一圈：上边 → 右上角 → 右边 → 右下角 → 下边 →
                左下角 → 左边 → 左上角 → 闭合。
   每个角记作 [竖边切点 A, 横边切点 B]，
   角弧把 A 弯到 B，然后一条直线接到下一个角的 A。
   起点取「上边切点」，终点自然回到起点，`Z` 闭合不产生多余线段。
   ========================================================================== */

var SQ_N = 5;        /* 超椭圆指数：5 最接近苹果观感 */
var SQ_STEPS = 8;    /* 每角采样数：8 足够平滑，再多只是浪费 path 长度 */

/**
 * 超椭圆角弧采样：从 A 弯到 B（不含 A，含 B）
 * @param {number[]} A 起点（竖边上的切点）
 * @param {number[]} B 终点（横边上的切点）
 * @param {number} n 指数
 * @param {number} steps 采样数
 */
function cornerArc(A, B, n, steps) {
  var m = 2 / n;                       /* 超椭圆指数倒数 */
  var pts = [];
  for (var i = 1; i <= steps; i++) {
    var t = (i / steps) * (Math.PI / 2);
    var ct = Math.cos(t), st = Math.sin(t);
    /* u: 1→0（沿 A→B 前进），v: 0→1（离开 A） */
    var u = Math.pow(ct, m);
    var v = Math.pow(st, m);
    pts.push([
      A[0] + (1 - u) * (B[0] - A[0]),
      A[1] + v * (B[1] - A[1])
    ]);
  }
  return pts;
}

/**
 * 生成连续圆角矩形 path
 * @param {number} w 宽 @param {number} h 高 @param {number} r 圆角
 * @param {number} [n] 指数（默认 5） @param {number} [steps] 每角采样（默认 8）
 */
function squirclePath(w, h, r, n, steps) {
  n = n || SQ_N;
  steps = steps || SQ_STEPS;
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  if (r === 0) {
    return 'M0 0 L' + f(w) + ' 0 L' + f(w) + ' ' + f(h) + ' L0 ' + f(h) + ' Z';
  }

  /* 顺时针四角。每角 = [竖边切点, 横边切点]
     起点在「上边靠右」= 右上角的 A */
  var corners = [
    [[w - r, 0], [w, r]],          /* 右上：上边 → 右边 */
    [[w, h - r], [w - r, h]],      /* 右下：右边 → 下边 */
    [[r, h], [0, h - r]],          /* 左下：下边 → 左边 */
    [[0, r], [r, 0]]               /* 左上：左边 → 上边（回到起点） */
  ];

  var d = 'M' + f(corners[0][0][0]) + ' ' + f(corners[0][0][1]);

  for (var i = 0; i < 4; i++) {
    var A = corners[i][0], B = corners[i][1];
    var pts = cornerArc(A, B, n, steps);
    for (var j = 0; j < pts.length; j++) {
      d += ' L' + f(pts[j][0]) + ' ' + f(pts[j][1]);
    }
    /* 直线段：当前角终点（= B）→ 下一个角起点（= nextA） */
    var nextA = corners[(i + 1) % 4][0];
    d += ' L' + f(nextA[0]) + ' ' + f(nextA[1]);
  }
  return d + ' Z';
}

function f(v) { return (Math.round(v * 100) / 100).toString(); }

/* 生成 CSS clip-path（形状裁剪，会连边框一起裁） */
function squircleClip(w, h, r, n) {
  return 'path("' + squirclePath(w, h, r, n) + '")';
}

/* 生成 SVG data URI，用作 mask —— 只裁背景不裁边框 */
function squircleMaskURI(w, h, r, n) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h +
    '" preserveAspectRatio="none"><path d="' + squirclePath(w, h, r, n) + '" fill="#000"/></svg>';
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g, '%27') + '")';
}

/**
 * 描边专用的 path：把边框画在路径上，而不是被裁掉。
 * 做法 = 外圈路径 + 反向内圈路径，stroke 只落在两圈之间。
 */
function squircleRingPath(w, h, r, sw, n) {
  var outer = squirclePath(w, h, r, n);
  var iw = w - sw * 2, ih = h - sw * 2;
  var ir = Math.max(0, r - sw);
  if (iw <= 0 || ih <= 0) return outer;
  var inner = squirclePath(iw, ih, ir, n).slice(1, -1);   /* 去掉 M 和 Z */
  /* 内圈用 transform 移到内侧不可行（path 不支持 transform），
     改成手写偏移：直接把每个坐标加 sw */
  var nums = inner.match(/-?\d+(?:\.\d+)?/g);
  var moved = '';
  for (var i = 0; i < nums.length; i += 2) {
    moved += 'L' + (parseFloat(nums[i]) + sw) + ' ' + (parseFloat(nums[i + 1]) + sw) + ' ';
  }
  return outer.slice(0, -1) + moved + ' Z';
}

var SQ = {
  path: squirclePath,
  clip: squircleClip,
  mask: squircleMaskURI,
  ring: squircleRingPath,
  N: SQ_N
};

if (typeof module !== 'undefined' && module.exports) { module.exports = SQ; }
if (typeof window !== 'undefined') { window.SQ = SQ; }
</script>

<script>
/* ==========================================================================
   调试面板 —— 只在测试版注入，方便你切到有问题的那一屏截图
   ========================================================================== */
(function () {
  function h(tag, css, txt) {
    var e = document.createElement(tag);
    if (css) e.setAttribute('style', css);
    if (txt != null) e.textContent = txt;
    return e;
  }
  var collapsed = true;

  /* 面板不能挡住底部 Tab 栏（之前固定在 bottom:0、z-index 99999，
     把整个 Tab 栏压在下面，用户看到"只有一条小边边"）。
     改成：默认收起成一条 30px 窄条，展开时向上长，不覆盖 dock。 */
  var root = h('div', [
    'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:99999',
    'background:#111', 'color:#eee', 'font:12px/1.5 -apple-system,sans-serif',
    'border-top:2px solid #31C27C', 'max-height:70vh', 'overflow:auto',
  ].join(';'));

  var bar = h('div', 'padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap');
  var body = h('div', 'padding:0 10px 10px;display:none');

  var btn = function (label, fn) {
    var b = h('button', [
      'background:#222', 'color:#eee', 'border:1px solid #444',
      'padding:5px 9px', 'border-radius:6px', 'font-size:11px', 'cursor:pointer',
    ].join(';'), label);
    b.addEventListener('click', fn);
    return b;
  };

  var toggle = btn('▲ 测试面板', function () {
    collapsed = !collapsed;
    body.style.display = collapsed ? 'none' : 'block';
    toggle.textContent = collapsed ? '▲ 测试面板' : '▼ 收起面板';
    /* 给 App 底部留出面板高度，避免面板压住 Tab 栏 */
    document.querySelector('.app').style.paddingBottom =
      collapsed ? '30px' : (body.offsetHeight + 30) + 'px';
  });
  bar.appendChild(toggle);
  bar.appendChild(h('span', 'color:#31C27C;font-weight:700',
    '切到有问题的状态再截图'));

  var section = function (title) {
    body.appendChild(h('div', 'color:#31C27C;margin:8px 0 4px;font-weight:700', title));
  };
  var row = function () {
    var r = h('div', 'display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px');
    body.appendChild(r);
    return r;
  };

  /* --- 皮肤 --- */
  section('皮肤');
  var r1 = row();
  CN.SKINS.forEach(function (s) {
    r1.appendChild(btn(s.n, function () {
      CN.settings.skin = s.v; CN.applySettings();
      CN.toast('已切到 ' + s.n);
    }));
  });

  /* --- 主题色 --- */
  section('主题色');
  var r2 = row();
  ['#FF6B4A','#F5426C','#FFC93D','#31C27C','#1BC5C8','#3B7DD8','#A66BFF','#FF6BC5'].forEach(function (c) {
    var b = h('button', 'width:26px;height:26px;border-radius:50%;border:2px solid #555;cursor:pointer;background:' + c);
    b.addEventListener('click', function () {
      CN.settings.accent = c; CN.applySettings();
      CN.toast('主题色 ' + c);
    });
    r2.appendChild(b);
  });

  /* --- 切页面 --- */
  section('切页面');
  var r3 = row();
  [['首页','home'],['搜索','search'],['导入','import'],['我的','settings']].forEach(function (p) {
    r3.appendChild(btn(p[0], function () { CN.go(p[1]); }));
  });
  r3.appendChild(btn('列表', function () { CN.openList({kind:'fav', title:'我喜欢的音乐'}); }));
  r3.appendChild(btn('外部占位歌单', function () { CN.openList({kind:'playlist', id:'p1', title:'通勤路上'}); }));

  /* --- 播放状态 --- */
  section('播放状态（当前无歌）');
  var r4 = row();
  r4.appendChild(btn('开始播放第1首', function () {
    CN.setQueue(CN.api.getFavorites() || [], 0);
  }));
  r4.appendChild(btn('播放/暂停', function () { CN.toggle(); }));
  r4.appendChild(btn('下一首', function () { CN.next(); }));
  r4.appendChild(btn('打开播放页', function () { CN.openPlayer(); }));
  r4.appendChild(btn('清空歌曲', function () {
    CN.S.queue = []; CN.S.qIndex = -1; CN.S.track = null; CN.S.state = 'idle'; CN.paint();
  }));

  /* --- 弹层 --- */
  section('弹层');
  var r5 = row();
  r5.appendChild(btn('歌曲操作', function () {
    CN.openSongSheet((CN.S.songs || CN.api.getFavorites() || [])[0] || null, 0);
  }));
  r5.appendChild(btn('歌曲详情', function () {
    CN.openDetailSheet((CN.S.songs || CN.api.getFavorites() || [])[0] || null);
  }));
  r5.appendChild(btn('播放队列', CN.openQueueSheet));
  r5.appendChild(btn('换音源', function () {
    CN.openSwapSheet((CN.S.songs || CN.api.getFavorites() || [])[0] || null);
  }));
  r5.appendChild(btn('加入歌单', function () {
    CN.openPickSheet((CN.S.songs || CN.api.getFavorites() || [])[0] || null);
  }));
  r5.appendChild(btn('新建歌单', function () { CN.newPlaylistSheet(null); }));
  r5.appendChild(btn('外部导入', function () {
    CN.$('impInput').value = 'https://music.example.com/n/music/playlist/1234567890';
    CN.doImport();
  }));

  /* --- 字号 / 密度 --- */
  section('字号与密度');
  var r6 = row();
  [['小','s'],['标准','m'],['大','l'],['特大','xl']].forEach(function (f) {
    r6.appendChild(btn('字号'+f[0], function () {
      CN.settings.fontsize = f[1]; CN.applySettings(); CN.toast('字号 ' + f[0]);
    }));
  });
  var r7 = row();
  [['紧凑','c'],['标准','n'],['宽松','r']].forEach(function (d) {
    r7.appendChild(btn('密度'+d[0], function () {
      CN.settings.density = d[1]; CN.applySettings(); CN.toast('密度 ' + d[0]);
    }));
  });

  /* --- 区域标注（A/B 区）--- */
  section('区域标注（截图反馈用）');
  var rR = row();
  var regionBtn = btn('开：A/B 区标注', function () {
    var on = CN.setRegion(!CN.regionOn);
    regionBtn.textContent = CN.regionOn ? '关：区域标注' : '开：A/B 区标注';
    CN.toast(CN.regionOn ? '已开启，每个区域左上角有字母牌' : '已关闭');
  });
  rR.appendChild(regionBtn);
  rR.appendChild(btn('重绘标注', function () {
    if (CN.repaintRegion) CN.repaintRegion();
    CN.toast('已重绘');
  }));

  /* --- 日志 --- */
  section('最近调用了哪些原生接口');
  var logBox = h('pre', 'margin:0;padding:6px;background:#1a1a1a;color:#8f8;border-radius:4px;' +
    'font-size:10px;max-height:90px;overflow:auto;white-space:pre-wrap');
  body.appendChild(logBox);
  setInterval(function () {
    logBox.textContent = (window.__MOCK && window.__MOCK.logs.length)
      ? window.__MOCK.logs.slice(-12).reverse().join('\n')
      : '(还没有)';
  }, 500);

  root.appendChild(bar);
  root.appendChild(body);
  document.body.appendChild(root);

  /* App 底部预留面板高度（默认收起 = 30px 细条） */
  document.querySelector('.app').style.paddingBottom = '30px';
})();
</script>
</body>

</html>
