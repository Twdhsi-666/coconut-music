<!DOCTYPE html>
<html lang="zh-CN" data-skin="paper">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FDF8F0">
  <meta name="format-detection" content="telephone=no">
  <title>椰子音乐</title>
<style>
/* ===== 00-tokens.css ===== */
/* ==========================================================================
   椰子音乐 4 · tokens.css
   手绘风格设计系统 · 唯一真相来源
   --------------------------------------------------------------------------
   风格：Hand-Drawn / Sketch
   圆润圆角 + 双线叠画（外层实线 + 内层低透明复线错开旋转）+ 手写体

   【与旧版最大的不同】
   旧版：0 圆角硬边框 + 硬投影 = 新粗野主义（方格子）
   本版：18–26px 圆润角 + 无硬投影 + 手写字 = 手绘感
   ========================================================================== */

:root {
  /* ---------- 字体族 ----------
     【2026-10-09 改】用户反馈："不希望用下载好的成品字体，
     手机自带字体是最好看的，手机自己会有一套自己的字体"。
     → 全部改回系统字体栈。手绘感只靠**线条与色块**表达，不依赖字体。
     Android 上会命中 Noto Sans CJK / 鸿蒙的 HarmonyOS Sans；
     iOS 上命中 PingFang SC。都不需要下载任何东西。 */
  --font-ui: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC',
             'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif;
  --font-num: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace;

  /* 字重：系统字体用 500/600 就够，不要 700（黑体会和手绘线条打架）*/
  --fw: 500;
  --fw-strong: 600;

  /* ---------- 纸底色 ----------
     不用纯白（刺眼），用暖米白纸感 */
  --paper: #FDF8F0;
  --paper-2: #FFFFFF;
  --paper-3: #FFF3E0;

  /* ---------- 墨色（线条与文字）---------- */
  --ink: #2B2B2B;          /* 主线条 */
  --ink-2: #4A4A44;        /* 次级文字 */
  --ink-3: #7A7A6E;        /* 辅助文字 */
  --ink-4: #A8A89C;        /* 占位/禁用 */

  /* ---------- 线条 ----------
     手绘感的核心：描边用圆头，略带不透明度

     【线宽体系 4.03 统一】
     之前全站混着 2.5px / 1.5px / 1.2px / 1px 四种，
     细线配粗线看着巨突兀（例：歌曲行描边很细，
     但「我的」里的头像框很粗）。
     用户原话：「可以试试把细线全部去掉，只保留粗线」
     → 现在**全站只有一级线宽 2.5px**。
     1px 以下的「发丝线」全部取消。 */
  --line-w: 2.5px;         /* 唯一描边线宽（全站统一） */
  --line-w-thin: 1.2px;    /* 复线（双线叠画的内层，由 --line-double 控制） */
  --line-alpha: 0.28;      /* 复线透明度 */
  /* 双线开关：1 = 双实线（手绘叠画），0 = 单实线。
     设置 → 外观里可切换。 */
  --line-double: 1;

  /* ---------- 强调色（可在设置里切换）---------- */
  --accent: #FF6B4A;       /* 珊瑚橘（默认）*/
  --accent-soft: #FFE8E0;
  --accent-2: #FFD93B;     /* 马克笔黄 */
  --accent-3: #3B7DD8;     /* 手绘蓝 */
  --accent-4: #1AE5C0;     /* 薄荷 */

  /* ---------- 圆角体系（圆润是手绘感的核心）---------- */
  --r-sm: 12px;      /* 小封面 */
  --r-md: 18px;      /* 卡片 */
  --r-lg: 22px;      /* 大卡片 / MiniPlayer */
  --r-xl: 26px;      /* Tab 栏 */
  --r-full: 999px;   /* 圆形按钮 */

  /* ---------- 尺寸（触摸目标 ≥44）---------- */
  --sz-icon: 44px;   /* 操作按钮 */
  --sz-icon-lg: 56px;/* 上下一首 */
  --sz-play: 64px;   /* 主播放键 */
  --sz-cover: 44px;  /* 行内封面 */
  --row-h: 60px;     /* 歌曲行高 */

  /* ---------- 间距 ----------
     【2026-10-09 加厚】用户反馈"图标大到离谱，占视野，要多留白"。
     留白不只是"多几个 px"，是重新分配：
       --pad   22 → 24   内容左右留白
       --gap-s  8 → 10   小间距
       --gap    14 → 16  常规间距
       --gap-l  20 → 26  区块内元素间距
       --gap-xl 28 → 36  区块间距
     封面在卡片里不再撑满，改成留出内边距。 */
  --pad: 24px;       /* 内容左右边距 */
  --gap-s: 10px;
  --gap: 16px;
  --gap-l: 26px;
  --gap-xl: 36px;

  /* ---------- 固定尺寸 ---------- */
  --topbar-h: 56px;
  --mini-h: 66px;
  --tabbar-h: 66px;

  /* ---------- 安全区 ---------- */
  --sys-top: 0px;
  --sys-bot: 0px;
  --safe-t: max(env(safe-area-inset-top, 0px), var(--sys-top, 0px));
  --safe-b: max(env(safe-area-inset-bottom, 0px), var(--sys-bot, 0px));

  /* ---------- 动效：手绘风要「慢一点、软一点」---------- */
  --ease: cubic-bezier(.34, 1.3, .64, 1);   /* 带回弹，像手按下去 */
  --t: transform .18s var(--ease), opacity .18s ease;
}

/* ==========================================================================
   主题：深色牛皮纸（设置里可切换）
   ========================================================================== */
html[data-skin="dark"] {
  --paper: #1C1A18;
  --paper-2: #262320;
  --paper-3: #302B26;
  --ink: #F5EFE4;
  --ink-2: #D8D0C2;
  --ink-3: #A09888;
  --ink-4: #6E675C;
  --accent: #FFD93B;
  --accent-soft: rgba(255, 217, 59, .16);
  --accent-2: #FF6B4A;
  --accent-3: #1AE5C0;
  --accent-4: #FF8AC4;
}

/* ==========================================================================
   主题：白底彩笔（设置里可切换）
   ========================================================================== */
html[data-skin="pen"] {
  --paper: #FFFFFF;
  --paper-2: #FFFDF5;
  --paper-3: #F0F7FF;
  --ink: #1A1A1A;
  --ink-2: #3D3D3D;
  --ink-3: #6B6B6B;
  --ink-4: #A0A0A0;
  --accent: #2E7DF7;
  --accent-soft: #E3EEFF;
  --accent-2: #FF4FA3;
  --accent-3: #37C978;
  --accent-4: #FFC53D;
}

/* ==========================================================================
   主题：夜光黑（设置里可切换）
   ========================================================================== */
html[data-skin="neon"] {
  --paper: #0D0D0D;
  --paper-2: #161616;
  --paper-3: #1E1E1E;
  --ink: #F0F0F0;
  --ink-2: #C8C8C8;
  --ink-3: #909090;
  --ink-4: #5A5A5A;
  --accent: #1AE5C0;
  --accent-soft: rgba(26, 229, 192, .14);
  --accent-2: #FF3D8A;
  --accent-3: #FFE14D;
  --accent-4: #6C8CFF;
}

/* ==========================================================================
   手绘线条工具类
   --------------------------------------------------------------------------
   .sketch —— 双线叠画。用法：给任意有 border-radius 的元素加上，
   它会自动生成一层低透明复线并轻微旋转，这是手绘感的核心手法。
   ========================================================================== */
.sketch {
  position: relative;
}

/* 手绘下划线：双线 + 圆头 */
.sketch-underline {
  height: 14px;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}


/* ===== 01-base.css ===== */
/* ==========================================================================
   椰子音乐 4 · 01-base.css
   重置 / 手绘基础组件 / 通用原子类
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: clamp(15px, 4.4vw, 17px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  transition: background-color .3s ease, color .3s ease;
}

h1, h2, h3, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font-family: inherit; }

/* ---------- 手写标题 ---------- */
.hand {
  font-family: var(--font-ui);
  font-weight: var(--fw-strong);
  line-height: 1.15;
  letter-spacing: .3px;
}
.hand-cn {
  font-family: var(--font-ui);
}

/* ---------- 通用排版 ---------- */
.t-page   { font-family: var(--font-ui); font-size: 2rem;   font-weight: var(--fw-strong); }
.t-sec    { font-family: var(--font-ui); font-size: 1.375rem; font-weight: var(--fw-strong); }
.t-card   { font-family: var(--font-ui); font-size: 1.125rem; font-weight: var(--fw-strong); }
.t-name   { font-size: .9375rem; line-height: 1.3; }
.t-artist { font-size: .8125rem; line-height: 1.35; color: var(--ink-3); }
.t-cap    { font-size: .75rem; color: var(--ink-3); }
.t-num    { font-variant-numeric: tabular-nums; }

/* ---------- 截断 ---------- */
.trunc {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- 滚动 ---------- */
.scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { width: 0; height: 0; }

.scroll-x {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.scroll-x::-webkit-scrollbar { height: 0; }

/* ==========================================================================
   手绘卡片 —— 全站唯一实现
   圆角 18px + 2.5px 墨色描边 + 双线叠画，无硬投影
   ========================================================================== */
.card {
  position: relative;
  background: var(--paper-2);
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-md);
  overflow: hidden;
}
/* 复线只在需要时叠，不覆盖子元素点击 */
.card > * { position: relative; z-index: 2; }

/* 卡片按钮
   【修】原来写 `border: 0`，把 <button> 的浏览器默认边框重置掉了 ——
   但 .card-btn 和 .card 同为类选择器、.card-btn 在后，
   于是把 .card 的 2.5px 描边整个覆盖成0。
   表现：入口卡/歌单卡完全没有描边，只剩直角框 + 复线，4倍放大能看到断成黑杠。
   修法：按钮默认样式只重置该重置的（背景/颜色/字体），
   描边交还给 .card。 */
.card-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  padding: 0;
}
.card-btn:active { transform: scale(.98); transition: var(--t); }

/* ==========================================================================
   手绘按钮
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--gap-s);
  min-height: var(--sz-icon);
  padding: 0 20px;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper-2);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1rem;
  cursor: pointer;
  transition: var(--t);
}
.btn:active { transform: scale(.95); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-fill {
  background: var(--accent);
  color: #fff;
}
html[data-skin="dark"] .btn-fill,
html[data-skin="neon"] .btn-fill { color: var(--paper); }

.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: .875rem; }

/* 圆形图标按钮：圆头描边 + 双线 */
.ibtn {
  position: relative;
  width: var(--sz-icon);
  height: var(--sz-icon);
  min-width: var(--sz-icon);
  min-height: var(--sz-icon);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper-2);
  color: var(--ink);
  cursor: pointer;
  padding: 0;
  transition: var(--t);
}
.ibtn:active { transform: scale(.9); }

/* 规则 G2：视觉 36px 但热区扩到 44px。
   伪元素不占布局，纯扩大可点范围。 */
.ibtn.sm::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 44px;
  height: 44px;
  transform: translate(-50%, -50%);
  pointer-events: auto;
}
.ibtn.fill { background: var(--accent); color: #fff; }
html[data-skin="dark"] .ibtn.fill,
html[data-skin="neon"] .ibtn.fill { color: var(--paper); }
.ibtn.sm { width: 36px; height: 36px; min-width: 36px; min-height: 36px; }
.ibtn.lg { width: var(--sz-icon-lg); height: var(--sz-icon-lg); min-width: var(--sz-icon-lg); min-height: var(--sz-icon-lg); }
.ibtn.xl { width: var(--sz-play); height: var(--sz-play); min-width: var(--sz-play); min-height: var(--sz-play); }
.ibtn.on { color: var(--accent); border-color: var(--accent); }

/* ==========================================================================
   SVG 图标
   ========================================================================== */
.svg {
  width: 1.375rem;
  height: 1.375rem;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
  pointer-events: none;
}
.svg-fill { fill: currentColor; stroke: none; }
.svg-sm { width: 1.125rem; height: 1.125rem; }
.svg-lg { width: 1.75rem; height: 1.75rem; }
.svg-xl { width: 2rem; height: 2rem; }

/* ==========================================================================
   歌曲行
   ========================================================================== */
.srow {
  display: flex;
  align-items: center;
  gap: var(--gap);
  min-height: var(--row-h);
  padding: var(--gap-s) 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background-color .18s ease;
}
/* ---- 歌曲行序号：对标 某音乐平台的两位大数字（01. 02. …）----
   原本序号在最左（宽 22px 小字），现在挪到封面之后，
   用大号等宽数字，成为这一行的视觉锚点。 */
.srow-no {
  flex: none;
  min-width: 34px;
  font-size: 1.25rem;
  font-weight: var(--fw-strong);
  line-height: 1;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: .5px;
  text-align: left;
}
/* 当前播放行：序号跟着歌名一起变强调色，和 某音乐平台一致 */
.srow.on .srow-no { color: var(--accent); }
.srow:active { background: var(--paper-3); }

.srow-cover {
  width: var(--sz-cover);
  height: var(--sz-cover);
  border-radius: var(--r-sm);
  border: var(--line-w) solid var(--ink);
  object-fit: cover;
  flex: none;
  background: var(--paper-3);
}

.srow-txt {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.srow-dur {
  flex: none;
  font-size: .75rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.srow-more {
  flex: none;
  width: 32px;
  height: 32px;
  border: 0;
  background: none;
  color: var(--ink-3);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: var(--r-full);
}

/* 正在播放：高亮 + 手绘声波 */
.srow.on .srow-name { color: var(--accent); }
.wave {
  width: var(--sz-cover);
  flex: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2.5px;
  height: var(--sz-cover);
}
.wave i {
  width: 3px;
  border-radius: 3px;
  background: var(--accent);
  animation: wv .9s ease-in-out infinite;
}
.wave i:nth-child(1) { height: 40%; animation-delay: 0s; }
.wave i:nth-child(2) { height: 80%; animation-delay: .15s; }
.wave i:nth-child(3) { height: 55%; animation-delay: .3s; }
.wave i:nth-child(4) { height: 90%; animation-delay: .45s; }
@keyframes wv {
  0%, 100% { transform: scaleY(.4); }
  50%      { transform: scaleY(1); }
}
.srow[data-state="paused"] .wave i { animation-play-state: paused; }

/* ==========================================================================
   横向入口条目（首页四个入口）
   --------------------------------------------------------------------------
   原来是 2×2 大方块 + 满幅封面，视觉重量太大（用户反馈"占视野"）。
   改成一行式：56px 小封面 + 文字 + 可选播放键。
   ========================================================================== */
.ent-row {
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: 12px 14px;
  min-height: 80px;
}
.ent-cover {
  width: 56px;
  height: 56px;
  flex: none;
  border-radius: var(--r-sm);
  border: var(--line-w) solid var(--ink);
  background-size: cover;
  background-position: center;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  position: relative;
  overflow: hidden;
}
.ent-cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* 【已删】.ent-cover::before —— 普通圆角复线（border-radius:9px + rotate(-1deg)）
   和超椭圆主描边形状对不上，旋转后四角会伸出主描边 → 封面出现缺口。
   复线改由 60-squircle-apply.js 的 overlay 画（与主描边同一条超椭圆路径）。 */
.ent-txt { flex: 1 1 0; min-width: 0; }
.ent-txt .t-name { font-weight: var(--fw-strong); }
.ent-play {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent);
  border: var(--line-w) solid var(--ink);
  color: #fff;
  display: grid;
  place-items: center;
}
html[data-skin="dark"] .ent-play,
html[data-skin="neon"] .ent-play { color: var(--paper); }

/* ==========================================================================
   设置行 / 列表行
   ========================================================================== */
.srow-set {
  display: flex;
  align-items: center;
  gap: var(--gap);
  min-height: 54px;
  padding: var(--gap) 16px;
  background: var(--paper-2);
  cursor: pointer;
  transition: background-color .18s ease;
  position: relative;
}
/* 行分隔线
   【删掉原来的 border-bottom:2px solid】
   那是直角线，而外层卡片的描边走的是连续圆角（超椭圆）——
   两套画法在卡片底部圆角处打架，视觉上就成了一条「歪斜的粗线」。
   改成「内侧渐隐」：从透明淡入到墨色，起点终点都是淡的，
   不与任何圆角冲突。 */
.srow-set + .srow-set::before {
  content: '';
  position: absolute;
  left: 16px;
  right: 16px;
  top: 0;
  height: 1px;
  background: linear-gradient(to right,
    transparent, var(--ink) 12%, var(--ink) 88%, transparent);
  opacity: .32;
  pointer-events: none;
}
.srow-set:active { background: var(--paper-3); }
.srow-set-txt { flex: 1 1 0; min-width: 0; }
.srow-set-val { flex: none; font-size: .8125rem; color: var(--ink-3); max-width: 40%; }
.srow-set-ico { flex: none; color: var(--ink-2); display: flex; }

/* 开关 */
.switch {
  flex: none;
  width: 54px;
  height: 32px;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper);
  position: relative;
  cursor: pointer;
  padding: 0;
  transition: var(--t);
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ink);
  transition: transform var(--ease);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); background: #fff; }

/* 选择器 chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--gap-s); padding: var(--gap) 16px; }
.chip {
  padding: 8px 16px;
  min-height: 38px;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper-2);
  color: var(--ink);
  font-size: .875rem;
  cursor: pointer;
  transition: var(--t);
}
.chip.on { background: var(--accent); color: #fff; border-color: var(--ink); }
html[data-skin="dark"] .chip.on,
html[data-skin="neon"] .chip.on { color: var(--paper); }

/* 主题色 / 皮肤选择圆点 */
.swatches { display: flex; flex-wrap: wrap; gap: var(--gap); padding: var(--gap) 16px; }
.swatch {
  width: 44px;
  height: 44px;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  cursor: pointer;
  position: relative;
  padding: 0;
  transition: var(--t);
}
.swatch.on::after {
  content: '';
  position: absolute;
  inset: 0;
  margin: auto;
  width: 14px;
  height: 8px;
  border-left: 3px solid #fff;
  border-bottom: 3px solid #fff;
  transform: rotate(-45deg) translate(2px, -3px);
}

/* ==========================================================================
   Sheet 抽屉
   ========================================================================== */
.sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 900;
  max-height: min(82vh, 82dvh);
  display: flex;
  flex-direction: column;
  background: var(--paper-2);
  border: var(--line-w) solid var(--ink);
  border-bottom: 0;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding-bottom: max(var(--safe-b), 8px);
  transform: translateY(100%);
  visibility: hidden;
  transition: transform .28s var(--ease), visibility .28s;
}
.sheet.on { transform: translateY(0); visibility: visible; }

.sheet-grab {
  flex: none;
  padding: 12px 0 6px;
  display: grid;
  place-items: center;
  cursor: grab;
  touch-action: none;
}
.sheet-grab i {
  width: 46px;
  height: 5px;
  border-radius: 3px;
  background: var(--ink-3);
  display: block;
}
.sheet-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: var(--gap) var(--pad);
  border-bottom: var(--line-w) solid var(--ink);
}
.sheet-title {
  flex: 1 1 0;
  min-width: 0;
  font-family: var(--font-ui);
  font-size: 1.5rem;
  font-weight: var(--fw-strong);
  text-align: center;
}
.sheet-hero {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: var(--gap) var(--pad);
  border-bottom: 2px solid var(--ink);
  background: var(--paper-3);
}
.sheet-hero img {
  width: 54px; height: 54px;
  border-radius: var(--r-sm);
  border: var(--line-w) solid var(--ink);
  object-fit: cover;
  flex: none;
}
.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding: var(--gap-s) 0;
}
.sheet-body::-webkit-scrollbar { width: 0; }
.sheet-foot {
  flex: none;
  padding: var(--gap) var(--pad);
  border-top: var(--line-w) solid var(--ink);
}

/* Sheet 条目 */
.sitem {
  display: flex;
  align-items: center;
  gap: var(--gap);
  width: 100%;
  min-height: 52px;
  padding: var(--gap-s) var(--pad);
  border: 0;
  background: none;
  color: var(--ink);
  font-size: .9375rem;
  text-align: left;
  cursor: pointer;
  transition: background-color .18s ease;
}
.sitem:active { background: var(--paper-3); }
.sitem-txt { flex: 1 1 0; min-width: 0; }
.sitem-sub { display: block; font-size: .75rem; color: var(--ink-3); margin-top: 2px; }
.sitem.danger { color: #E5484D; }
.sitem.on { color: var(--accent); }

/* ==========================================================================
   Toast / 遮罩 / 空态
   ========================================================================== */
.scrim {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .45);
  z-index: 940;
  opacity: 0;
  visibility: hidden;
  transition: opacity .22s ease, visibility .22s;
}
.scrim.on { opacity: 1; visibility: visible; }

.toast {
  position: absolute;
  left: 50%;
  bottom: calc(var(--mini-h) + var(--tabbar-h) + var(--safe-b) + 16px);
  transform: translateX(-50%) translateY(10px);
  z-index: 1000;
  max-width: 84%;
  padding: 12px 18px;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper-2);
  color: var(--ink);
  font-size: .8125rem;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: all .22s ease;
}
.toast.on { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--gap);
  padding: 56px var(--pad);
  text-align: center;
  color: var(--ink-3);
}
.empty .svg { width: 56px; height: 56px; opacity: .35; stroke-width: 1.5; }

.spinner {
  width: 24px; height: 24px;
  border: 3px solid var(--ink-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sr {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

[hidden] { display: none !important; }

/* ==========================================================================
   响应式（3 档够用，窄屏收紧、宽屏封顶、横屏切两栏）
   ========================================================================== */
@media (max-width: 360px) {
  html { --pad: 16px; --row-h: 56px; }
  .t-page { font-size: 1.75rem; }
  .tab { font-size: .75rem; }
}

@media (min-width: 600px) {
  html { --pad: 32px; }
  .sheet { left: 50%; transform: translate(-50%, 100%); width: min(560px, 100%); border-radius: var(--r-xl); bottom: 16px; border-bottom: var(--line-w) solid var(--ink); }
  .sheet.on { transform: translate(-50%, 0); }
}

/* 横屏：全屏播放页切两栏 */
@media (orientation: landscape) and (max-height: 560px) {
  .pp-inner { flex-direction: row; gap: 24px; }
  .pp-stage { flex: 0 0 40%; height: 100%; }
  .pp-side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
}

/* 减少动效 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* 连续圆角由 60-squircle-apply.js 以「超椭圆描边环背景」实现，
   见该文件头部的方案说明。 */


/* ===== 02-layout.css ===== */
/* ==========================================================================
   椰子音乐 4 · 02-layout.css
   App 外壳 / 视图切换 / 顶栏 / 底部 Dock / 全屏播放页
   --------------------------------------------------------------------------
   结构：一根垂直 flex 链，高度全由令牌分配，零 JS 实测补偿
       app(min-height:100dvh)
         ├─ toolbar  (flex:none)
         ├─ main     (flex:1, min-height:0)  ← 视图切换在这层
         └─ dock     (flex:none)  ← MiniPlayer + Tab 栏
   ========================================================================== */

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;      /* 降级链 */
  min-height: 100dvh;
  max-width: var(--content-max, 560px);
  margin: 0 auto;
  position: relative;
  background: var(--paper);
  overflow: hidden;
}

/* ==========================================================================
   .shell —— 内容列容器
   --------------------------------------------------------------------------
   【这里曾经漏了定义，是个真 bug】
   .shell 是 .app 的 flex 子项，DOM 里常驻。若不给它 flex 属性：
     · 窄屏下它变成普通块级元素 → 内部的 topbar/main/dock 全部脱离 flex 布局
       → Tab 栏被顶到最上面、内容区塌成一片空白
     · 只有 ≥840px 的媒体查询里定义了它，于是只有宽屏"看起来正常"
   所以 .shell 必须在**基础样式**里定义，媒体查询里只做覆盖。
   ========================================================================== */
.shell {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ==========================================================================
   一、顶栏
   ========================================================================== */
.topbar {
  flex: none;
  padding-top: var(--safe-t);
  background: var(--paper);
  transition: background-color .3s ease;
  z-index: 20;
  position: relative;
}

.tb-row {
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  min-height: var(--topbar-h);
  padding: 0 var(--pad);
}

.tb-title {
  flex: 1 1 0;
  min-width: 0;
  font-family: var(--font-ui);
  font-size: 2rem;
  font-weight: var(--fw-strong);
  line-height: 1.1;
}

.tb-acts {
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  flex: none;
}

/* 搜索行 */
.tb-search {
  padding: 0 var(--pad) var(--gap);
  display: flex;
  align-items: center;
  gap: var(--gap-s);
}
.searchbox {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  height: 46px;
  padding: 0 16px;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper-2);
  position: relative;
}
.searchbox input {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font-family: inherit;
  font-size: 1rem;
  outline: none;
  position: relative;
  z-index: 2;
}
.searchbox input::placeholder { color: var(--ink-4); }
.searchbox input::-webkit-search-cancel-button { display: none; }
.searchbox .svg { position: relative; z-index: 2; flex: none; }

/* ==========================================================================
   二、主内容区 + 视图切换
   ========================================================================== */
.main {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

.view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--paper);
  /* 显隐由 .view.on 的类 + JS 内联 visibility 共同控制。
     这里**不要**再写 visibility:hidden —— 那会和 JS 的内联设置打架，
     出现"DOM 有内容、切过去了却还是看不见"。 */
  opacity: 0;
  transform: translateX(4%);
  transition: transform .26s var(--ease), opacity .22s ease, visibility .26s;
}
.view.on { opacity: 1; transform: translateX(0); }
.view.left { transform: translateX(-4%); }

.view-pad { padding: 0 var(--pad); }
.pad-b {
  height: calc(var(--mini-h) + var(--tabbar-h) + var(--safe-b) + var(--gap-xl));
}

/* 分区标题 + 手绘下划线 */
.sec {
  padding: var(--gap-xl) 0 var(--gap);
  display: flex;
  align-items: flex-end;
  gap: var(--gap);
}
.sec-h {
  font-family: var(--font-ui);
  font-size: 1.5rem;
  font-weight: var(--fw-strong);
  line-height: 1;
}
.sec-more {
  margin-left: auto;
  font-size: .875rem;
  color: var(--ink-2);
  cursor: pointer;
  border: 0;
  background: none;
  padding: 4px 0;
  font-family: inherit;
}

/* ==========================================================================
   分区按钮（2026-10-09 加）
   --------------------------------------------------------------------------
   用户反馈设置页的「外观」「播放」「关于」应该是按钮。
   做法：做成手绘风格的胶囊按钮，取代原来纯文字的标题 ——
   标题本身可点，点开对应分区；手绘感靠双线描边 + 略歪的旋转。
   ========================================================================== */
.sec-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--gap-s);
  min-height: 44px;
  padding: 0 20px;
  margin-bottom: var(--gap-s);
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-full);
  background: var(--paper-2);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1.125rem;
  font-weight: var(--fw-strong);
  cursor: pointer;
  transition: var(--t);
}
.sec-btn:active { transform: scale(.96); }
.sec-btn .svg { width: 20px; height: 20px; }
.sec-btn .cnt {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: var(--r-full);
  background: var(--accent);
  border: var(--line-w) solid var(--ink);
  color: #fff;
  font-size: .75rem;
  font-weight: var(--fw);
  display: grid;
  place-items: center;
  line-height: 1;
}
html[data-skin="dark"] .sec-btn .cnt,
html[data-skin="neon"] .sec-btn .cnt { color: var(--paper); }

/* 分组内容：默认收起，点分区按钮才展开
   【踩坑记录】先试过 max-height:0+overflow:hidden，
   又试过 grid-template-rows:0fr→1fr，
   两种做法都会把里面的 .card 压成 0 高（.card 是 position:relative，
   高度完全由内容撑，而折叠容器把内容区可视高度限制成 0）。
   最后用最朴素的 display 切换 —— 收起时彻底不渲染，展开时正常显示。
   要动画就在内容上加 opacity/transform，不在容器上做高度动画。 */
.sec-body {
  display: none;
}
.sec-body.open {
  display: block;
  animation: secIn .26s var(--ease);
}
@keyframes secIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* 收起时留出底部呼吸，不贴下一个分区 */
.sec-group { margin-bottom: var(--gap); }

/* ==========================================================================
   三、底部 Dock
   ========================================================================== */
.dock {
  flex: none;
  z-index: 40;
  background: var(--paper);
  padding-bottom: var(--safe-b);
}

/* ---------- MiniPlayer ---------- */
.mini {
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  height: var(--mini-h);
  margin: 0 var(--pad) var(--gap-s);
  padding: 0 10px;
  position: relative;
  background: var(--paper-2);
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-lg);
  cursor: pointer;
  overflow: hidden;
}
.mini-cover {
  width: 42px; height: 42px;
  border-radius: var(--r-sm);
  border: var(--line-w) solid var(--ink);
  object-fit: cover;
  flex: none;
  background: var(--paper-3);
}
.mini-meta {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  position: relative;
  z-index: 2;
}
.mini-title {
  font-family: var(--font-ui);
  font-size: 1.25rem;
  font-weight: var(--fw-strong);
  line-height: 1.1;
}
.mini-artist { font-size: .75rem; color: var(--ink-3); line-height: 1.2; }
.mini-lyric { font-size: .6875rem; color: var(--accent); line-height: 1.2; }
.mini-acts { display: flex; align-items: center; gap: 6px; flex: none; position: relative; z-index: 2; }
/* 播放进度条
   【修】原来 bottom:6px，2.5px 描边的内沿正好在bottom:5px，
   进度条压在描边上 → 视觉重叠。
   改成 bottom:7px（描边内沿 +2px），并给轨道加一条底槽，
   这样进度条与描边之间有明确留白，不会糊在一起。 */
.mini-prog {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 7px;
  height: 5px;
  border-radius: 3px;
  background: transparent;
  width: auto;
  z-index: 3;
  /* 底槽：整条都可见，未播放部分是浅色轨道 */
  box-shadow: inset 0 0 0 99px var(--line-track, rgba(43, 43, 43, .1));
  pointer-events: none;
}
/* 已播放部分用 --w 宽度叠加，靠 background-size 裁出 */
.mini-prog::before {
  content: '';
  position: absolute;
  inset: 0;
  width: var(--p, 0%);
  border-radius: 3px;
  background: var(--accent);
}

/* 收起态 */
.app[data-mini="off"] .mini {
  height: 0;
  margin-bottom: 0;
  padding: 0;
  border-width: 0;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  transition: height .24s var(--ease), opacity .2s, margin .24s var(--ease);
}

/* ---------- Tab 栏 ---------- */
.tabbar {
  display: flex;
  align-items: stretch;
  gap: 2px;
  height: var(--tabbar-h);
  margin: 0 var(--pad);
  padding: 0 4px;
  background: var(--paper-2);
  border: var(--line-w) solid var(--ink);
  border-radius: var(--r-xl);
  position: relative;
  /* 5 个 Tab 在 393px 下必须放得下：强制 flex:1 + min-width:0，
     否则文字撑破会把「我的」挤出屏幕。 */
  min-width: 0;
}

.tab {
  flex: 1 1 0;
  min-width: 0;              /* 关键：没有这句，文字会把容器撑破 */
  height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  /* 【修】原来 gap:1px + line-height:1.15，
     文字盒比视觉重心高 → 「首页」等字微微往上压线。
     改用「图标 + 文字各占一半」的显式分配：
     gap 略加到 3px，文字给固定 line-height 并微降 baseline。 */
  gap: 3px;
  border: var(--line-w) solid transparent;
  border-radius: var(--r-full);
  background: none;
  color: var(--ink-4);
  font-family: inherit;
  font-size: .75rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 2px;
  overflow: hidden;
  transition: var(--t);
  position: relative;
  z-index: 2;
}
.tab .svg { width: 21px; height: 21px; flex: none; }
.tab span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* 【修】文字盒按line-height 精确居中，
     再上移 1px 抵消中文视觉重心偏下的习惯。
     不加这句时「首页/搜索」会微微往上压线。 */
  line-height: 14px;
  display: block;
  transform: translateY(1px);
}
.tab.on {
  background: var(--accent);
  border-color: var(--ink);
  color: #fff;
}
html[data-skin="dark"] .tab.on,
html[data-skin="neon"] .tab.on { color: var(--paper); }
.tab:active { transform: scale(.92); }

.tab .dot {
  position: absolute;
  top: 4px;
  right: 12px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent-2);
  border: var(--line-w) solid var(--ink);
}

/* ==========================================================================
   四、全屏播放页
   --------------------------------------------------------------------------
   高度预算（永不压叠）：
     head(52) → stage(flex:1,min-height:0) → info/lyric/prog/ctl/acts 固定
   封面用 aspect-ratio + max-height 双重约束，任何视口都不溢出
   ========================================================================== */
.ppage {
  position: absolute;
  inset: 0;
  z-index: 970;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  visibility: hidden;
  opacity: 0;
  transform: translateY(3%);
  transition: transform .3s var(--ease), opacity .24s ease, visibility .3s;
  overflow: hidden;
}
.ppage.on { visibility: visible; opacity: 1; transform: translateY(0); }

.pp-inner {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: var(--safe-t) var(--pad) max(var(--safe-b), var(--gap));
}

.pp-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  min-height: 52px;
}
.pp-head-txt { flex: 1 1 0; min-width: 0; text-align: center; }
.pp-src {
  font-family: var(--font-ui);
  font-size: 1.125rem;
  font-weight: var(--fw-strong);
  line-height: 1.2;
}
.pp-srcsub { font-size: .6875rem; color: var(--ink-3); line-height: 1.2; }

.pp-stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--gap) 0;
}
.pp-disc {
  position: relative;
  aspect-ratio: 1;
  width: min(100%, 340px);
  max-height: 100%;
  border-radius: var(--r-lg);
  border: var(--line-w) solid var(--ink);
  overflow: hidden;
  background: var(--paper-3);
}
.pp-cover {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* 信息 */
.pp-info {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: var(--gap) 0;
}
.pp-tblock { flex: 1 1 0; min-width: 0; }
.pp-title {
  font-family: var(--font-ui);
  font-size: 2rem;
  font-weight: var(--fw-strong);
  line-height: 1.1;
}
.pp-artist { font-size: .9375rem; color: var(--ink-3); margin-top: 2px; }

/* 歌词 */
.pp-lyricbox {
  flex: 0 1 auto;
  min-height: 0;
  max-height: 92px;
  overflow: hidden;
  position: relative;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent);
}
.pp-lyric {
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: transform .3s var(--ease);
  padding: 8px 0;
}
.pp-lyric-line {
  font-size: 1rem;
  line-height: 1.5;
  color: var(--ink-4);
  transition: color .2s ease, transform .2s var(--ease);
}
.pp-lyric-line.on { color: var(--ink); font-weight: var(--fw-strong); transform: scale(1.02); }
.pp-lyric-msg {
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  font-size: .8125rem;
  color: var(--ink-4);
  padding: 8px 0;
}

/* 进度条 */
.pp-prog {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  padding: var(--gap) 0 var(--gap-s);
}
.pp-time { flex: none; font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 38px; }
.pp-time:last-child { text-align: right; }
.pp-track {
  flex: 1 1 0;
  min-width: 0;
  height: 6px;
  border-radius: 3px;
  background: var(--paper-3);
  border: var(--line-w) solid var(--ink);
  position: relative;
  cursor: pointer;
  touch-action: none;
}
.pp-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--p, 0%);
  background: var(--accent);
  border-radius: 2px;
}

/* 控制 */
.pp-ctl {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--gap-l);
  padding: var(--gap) 0;
}
.pp-ico {
  width: var(--sz-icon-lg);
  height: var(--sz-icon-lg);
  min-width: var(--sz-icon-lg);
  min-height: var(--sz-icon-lg);
  border: 0;
  background: none;
  color: var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  border-radius: var(--r-full);
  transition: var(--t);
}
.pp-ico:active { transform: scale(.88); }
.pp-ico .svg { width: 30px; height: 30px; }

/* 动作行 */
.pp-acts {
  flex: none;
  display: flex;
  gap: var(--gap-s);
  justify-content: center;
  padding-top: var(--gap-s);
}
.pp-act {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 2px;
  min-height: var(--sz-icon);
  border: 0;
  background: none;
  color: var(--ink-3);
  font-family: inherit;
  font-size: .6875rem;
  cursor: pointer;
  border-radius: var(--r-sm);
  transition: var(--t);
}
.pp-act:active { transform: scale(.94); background: var(--paper-3); }
.pp-act.on { color: var(--accent); }
.pp-act .svg { width: 22px; height: 22px; }

/* ==========================================================================
   五、窄屏 / 宽屏
   ========================================================================== */
@media (min-width: 840px) {
  .app { flex-direction: row; max-width: none; }
  .tabbar {
    order: -1;
    flex-direction: column;
    width: 92px;
    height: auto;
    margin: var(--pad) 0;
    align-items: stretch;
    padding: 10px 6px;
    gap: 6px;
  }
  .tab { flex: none; height: 64px; }
  .shell {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
  }
  .pad-b { height: calc(var(--mini-h) + var(--safe-b) + var(--gap-xl)); }
  .dock { border-top: 0; }
}

</style>
</head>

<body>
  <div class="app" id="app" data-mini="on">

    <div class="shell" id="shell">

      <!-- ============ 顶栏 ============ -->
      <header class="topbar" id="topbar">
        <div class="tb-row">
          <div class="tb-title trunc" id="tbTitle">椰子音乐</div>
          <div class="tb-acts">
            <button class="ibtn sm" id="themeBtn" aria-label="切换外观">
              <svg class="svg svg-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
            </button>
            <button class="ibtn sm" id="setBtn" aria-label="设置">
              <svg class="svg svg-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>
            </button>
          </div>
        </div>

        <!-- 搜索行（独立 Tab 之外也随时可搜） -->
        <div class="tb-search" id="tbSearch">
          <div class="searchbox">
            <svg class="svg svg-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="searchInput" type="search" placeholder="搜歌名、歌手、UP主"
                   autocomplete="off" enterkeyhint="search" aria-label="搜索">
          </div>
        </div>
      </header>

      <!-- ============ 内容区 ============ -->
      <main class="main" id="main">

        <!-- ---------- 首页 ---------- -->
        <section class="view on" id="viewHome">
          <div class="scroll">
            <div class="view-pad">

              <!-- 正在播放大卡 -->
              <div class="card sketch" id="homeNow" style="margin-top:var(--gap);display:none">
                <div style="display:flex;gap:var(--gap);padding:14px;align-items:center">
                  <img id="homeNowCov" class="srow-cover" style="width:88px;height:88px" src="" alt="">
                  <div style="flex:1 1 0;min-width:0">
                    <div class="t-cap" style="color:var(--accent);margin-bottom:2px">正在播放</div>
                    <div class="hand trunc" style="font-size:1.375rem" id="homeNowT">未在播放</div>
                    <div class="t-artist trunc" id="homeNowA">—</div>
                  </div>
                  <button class="ibtn lg fill" id="homeNowPlay" aria-label="播放">
                    <svg class="svg svg-fill" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  </button>
                </div>
              </div>

              <!-- 我的音乐：四入口 -->
              <div class="sec"><span class="sec-h">我的音乐</span></div>
              <div id="homeGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)"></div>

              <!-- 自建歌单 -->
              <div class="sec">
                <span class="sec-h">自建歌单</span>
                <button class="sec-more" id="addPlBtn">＋ 新建</button>
              </div>
              <div class="scroll-x" style="padding-bottom:var(--gap)">
                <div id="plGrid" style="display:flex;gap:var(--gap)"></div>
              </div>

              <div class="pad-b"></div>
            </div>
          </div>
        </section>

        <!-- ---------- 搜索 ---------- -->
        <section class="view" id="viewSearch" style="visibility:hidden">
          <div class="scroll">
            <div class="view-pad">
              <div id="searchBanner"></div>
              <div class="sec" id="histSec">
                <span class="sec-h">最近搜过</span>
                <button class="sec-more" id="histClear">清空</button>
              </div>
              <div id="histChips" style="display:flex;flex-wrap:wrap;gap:var(--gap-s);padding-bottom:var(--gap)"></div>
              <div id="searchBody"></div>
              <div class="pad-b"></div>
            </div>
          </div>
        </section>

        <!-- ---------- 通用列表 ---------- -->
        <section class="view" id="viewList" style="visibility:hidden">
          <div class="scroll">
            <div class="view-pad">
              <div style="display:flex;gap:var(--gap);align-items:center;padding:var(--gap) 0">
                <img id="listCover" class="srow-cover" style="width:76px;height:76px;border-radius:var(--r-md)" src="" alt="">
                <div style="flex:1 1 0;min-width:0">
                  <div class="hand trunc" style="font-size:1.5rem" id="listTitle">列表</div>
                  <div class="t-artist" id="listSub"></div>
                </div>
                <button class="ibtn fill" id="listPlayAll" aria-label="播放全部">
                  <svg class="svg svg-fill" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ibtn" id="listMore" aria-label="更多">
                  <svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" class="svg-fill"/><circle cx="12" cy="12" r="1.6" class="svg-fill"/><circle cx="12" cy="19" r="1.6" class="svg-fill"/></svg>
                </button>
              </div>

              <div id="songList" style="display:flex;flex-direction:column;gap:4px"></div>
              <div id="songFoot"></div>
              <div class="pad-b"></div>
            </div>
          </div>
        </section>

        <!-- ---------- 导入 ---------- -->
        <section class="view" id="viewImport" style="visibility:hidden">
          <div class="scroll">
            <div class="view-pad">
              <div id="importBanner" style="margin-top:var(--gap)"></div>

              <div class="card sketch" style="margin-top:var(--gap);padding:var(--pad)">
                <div class="hand" style="font-size:1.5rem">导入歌单</div>
                <p class="t-cap" style="margin-top:4px">粘贴链接，或选朋友发来的 TXT 文件</p>

                <div class="searchbox" style="margin-top:var(--gap)">
                  <input id="impInput" placeholder="粘贴 外部歌单 / 某弹幕网站 链接" autocomplete="off"
                         enterkeyhint="go" aria-label="导入链接">
                </div>

                <div style="display:flex;gap:var(--gap-s);margin-top:var(--gap)">
                  <button class="btn btn-fill" style="flex:1" id="impBtn">开始导入</button>
                  <button class="btn" style="flex:none" id="pickTxtBtn">选 TXT</button>
                </div>

                <div id="impProgWrap" style="margin-top:var(--gap);display:none">
                  <div style="height:8px;border:var(--line-w) solid var(--ink);border-radius:4px;overflow:hidden;background:var(--paper-3)">
                    <div id="impProg" style="height:100%;width:var(--p,0%);background:var(--accent)"></div>
                  </div>
                </div>
              </div>

              <div class="card" style="margin-top:var(--gap);padding:var(--pad);background:var(--paper-3)">
                <div class="t-cap" style="font-weight:700;margin-bottom:8px">链接从哪来？</div>
                <div class="t-cap" style="line-height:1.9">
                  <b>某音乐平台</b>：歌单页 → 分享 → 复制链接<br>
                  <b>某弹幕网站</b>：视频/收藏夹 → 分享 → 复制链接<br>
                  <b>朋友分享</b>：收到 TXT 后点「选 TXT」<br>
                  <span style="opacity:.6">导入很快；音源在首次播放时自动匹配</span>
                </div>
              </div>

              <div id="impResult" style="margin-top:var(--gap)"></div>
              <div class="pad-b"></div>
            </div>
          </div>
        </section>

        <!-- ---------- 我的 ---------- -->
        <section class="view" id="viewSettings" style="visibility:hidden">
          <div class="scroll">
            <div class="view-pad">
              <!-- 账号 -->
              <div class="card sketch card-btn" id="userCard" style="margin-top:var(--gap);padding:var(--pad);display:flex;align-items:center;gap:var(--gap)">
                <div style="width:52px;height:52px;border-radius:50%;border:var(--line-w) solid var(--ink);display:grid;place-items:center;flex:none;background:var(--accent-soft)">
                  <svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
                </div>
                <div style="flex:1 1 0;min-width:0">
                  <div class="hand trunc" style="font-size:1.25rem" id="uName">未登录</div>
                  <div class="t-cap trunc" id="uSub">登录后可同步 某弹幕网站收藏</div>
                </div>
                <button class="btn btn-sm" id="loginBtn">登录</button>
              </div>

              <!-- 分区按钮：手绘风格，点标题展开/收起 -->
              <div class="sec-group">
                <button class="sec-btn" data-sec="set" aria-expanded="true">
                  <svg class="svg" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.3-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.1-9-7.1z"/><circle cx="7.5" cy="11" r="1" class="svg-fill"/><circle cx="10" cy="7" r="1" class="svg-fill"/><circle cx="15" cy="8" r="1" class="svg-fill"/></svg>
                  <span>外观</span>
                </button>
                <div class="sec-body open" id="secSet"><div class="card" id="setRows"></div></div>
              </div>

              <div class="sec-group">
                <button class="sec-btn" data-sec="play" aria-expanded="true">
                  <svg class="svg" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
                  <span>播放</span>
                </button>
                <div class="sec-body open" id="secPlay"><div class="card" id="playRows"></div></div>
              </div>

              <div class="sec-group">
                <button class="sec-btn" data-sec="about" aria-expanded="true">
                  <svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
                  <span>关于</span>
                </button>
                <div class="sec-body open" id="secAbout"><div class="card" id="aboutRows"></div></div>
              </div>

              <div class="pad-b"></div>
            </div>
          </div>
        </section>

      </main>

      <!-- ============ Dock ============ -->
      <div class="dock" id="dock">
        <!-- MiniPlayer -->
        <div class="mini" id="mini" data-state="idle" role="button" tabindex="0" aria-label="迷你播放器">
          <img class="mini-cover" id="miniCov" src="" alt="">
          <div class="mini-meta">
            <div class="mini-title trunc" id="miniT">未在播放</div>
            <div class="mini-artist trunc" id="miniA">—</div>
            <div class="mini-lyric trunc" id="miniLyric"></div>
          </div>
          <div class="mini-acts">
            <button class="ibtn sm" id="miniFav" aria-label="收藏">
              <svg class="svg svg-sm" viewBox="0 0 24 24"><path d="M12 20.5S4 15.5 4 10a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 5.5-8 10.5-8 10.5z"/></svg>
            </button>
            <button class="ibtn sm fill" id="miniPlay" aria-label="播放/暂停">
              <svg class="svg svg-sm svg-fill" id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
          <i class="mini-prog" id="miniProg"></i>
        </div>

        <!-- ============ Tab 栏 ============
             必须放在 .dock 内部。之前它挂在 .app 下、.shell 外面，
             窄屏时不在 shell 的 flex 流里 → 跑不到底部，dock 只剩 mini。 -->
        <nav class="tabbar" id="tabbar" aria-label="主导航">
          <button class="tab on" data-view="home">
            <svg class="svg svg-fill" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
            <span>首页</span>
          </button>
          <button class="tab" data-view="search">
            <svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span>搜索</span>
          </button>
          <button class="tab" data-view="fav">
            <svg class="svg" viewBox="0 0 24 24"><path d="M12 20.5S4 15.5 4 10a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 5.5-8 10.5-8 10.5z"/></svg>
            <span>喜欢</span>
          </button>
          <button class="tab" data-view="import">
            <svg class="svg" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>
            <span>导入</span>
            <i class="dot" id="tabDot" hidden></i>
          </button>
          <button class="tab" data-view="settings">
            <svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.2 2.2M16.8 16.8L19 19M19 5l-2.2 2.2M7.2 16.8L5 19"/></svg>
            <span>我的</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- ============ 遮罩 ============ -->
    <div class="scrim" id="scrim"></div>

    <!-- ============ Sheet ============ -->
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab" id="sheetGrab"><i></i></div>
      <div class="sheet-head">
        <span style="width:44px;flex:none"></span>
        <span class="sheet-title trunc" id="sheetTitle">操作</span>
        <button class="ibtn sm" id="sheetClose" aria-label="关闭">
          <svg class="svg svg-sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-hero" id="sheetHero" hidden></div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot" hidden></div>
    </div>

    <!-- ============ 全屏播放页 ============ -->
    <div class="ppage" id="ppage" data-state="idle" role="dialog" aria-modal="true" aria-label="播放页">
      <div class="pp-inner">
        <div class="pp-head">
          <button class="ibtn sm" id="ppDown" aria-label="收起">
            <svg class="svg svg-sm" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>
          </button>
          <div class="pp-head-txt">
            <div class="pp-src trunc" id="ppSrc">正在播放</div>
            <div class="pp-srcsub trunc" id="ppSrcSub">—</div>
          </div>
          <button class="ibtn sm" id="ppMode" aria-label="播放模式">
            <svg class="svg svg-sm" id="ppModeIcon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
          </button>
        </div>

        <div class="pp-stage">
          <div class="pp-disc">
            <img class="pp-cover" id="ppCover" src="" alt="">
          </div>
        </div>

        <div class="pp-side">
          <div class="pp-info">
            <div class="pp-tblock">
              <div class="pp-title trunc" id="ppTitle">未在播放</div>
              <div class="pp-artist trunc" id="ppArtist">—</div>
            </div>
            <button class="ibtn" id="ppFav" aria-label="收藏">
              <svg class="svg" viewBox="0 0 24 24"><path d="M12 20.5S4 15.5 4 10a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 5.5-8 10.5-8 10.5z"/></svg>
            </button>
          </div>

          <div class="pp-lyricbox">
            <div class="pp-lyric" id="ppLyric">
              <div class="pp-lyric-msg"><div class="spinner"></div>歌词加载中…</div>
            </div>
          </div>

          <div class="pp-prog">
            <span class="pp-time" id="ppCur">0:00</span>
            <div class="pp-track" id="ppTrack" role="slider" aria-label="进度" tabindex="0"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <i class="pp-fill" id="ppFill"></i>
            </div>
            <span class="pp-time" id="ppDur">0:00</span>
          </div>

          <div class="pp-ctl">
            <button class="pp-ico" id="ppPrev" aria-label="上一首">
              <svg class="svg svg-fill" viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM19 6v12l-9-6z"/></svg>
            </button>
            <button class="ibtn xl fill" id="ppPlay" aria-label="播放/暂停">
              <svg class="svg svg-lg svg-fill" id="ppPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="pp-ico" id="ppNext" aria-label="下一首">
              <svg class="svg svg-fill" viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM5 6v12l9-6z"/></svg>
            </button>
          </div>

          <div class="pp-acts">
            <button class="pp-act" id="ppDownload">
              <svg class="svg" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>
              <span>下载</span>
            </button>
            <button class="pp-act" id="ppAdd">
              <svg class="svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              <span>加入</span>
            </button>
            <button class="pp-act" id="ppLoud">
              <svg class="svg" viewBox="0 0 24 24"><path d="M4 9v6h3l5 4V5L7 9z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/></svg>
              <span>响度</span>
            </button>
            <button class="pp-act" id="ppSwap">
              <svg class="svg" viewBox="0 0 24 24"><path d="M4 8h13M14 5l3 3-3 3M20 16H7M10 13l-3 3 3 3"/></svg>
              <span>换源</span>
            </button>
            <button class="pp-act" id="ppQueue">
              <svg class="svg" viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7"/><circle cx="18" cy="15" r="2.5"/></svg>
              <span>队列</span>
            </button>

CN.coverUrl = function (u, w) {
  if (!u) return '';

  /* 已经是完整可用地址就不加工，否则拼出的后缀反而会把它弄坏 */
  if (u.indexOf('data:') === 0) return u;

  if (u.indexOf('//') === 0) u = 'https:' + u;
  if (u.indexOf('http://') === 0) u = 'https://' + u.slice(7);
  u = u.replace(/@\d+w_\d+h_\d+c\.[a-z]+$/i, '');

CN.http = {
  get: function (path, params) {

      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
