/* ==========================================================================
   八、事件
   ========================================================================== */
CN.on = function (id, evt, fn) {
  var el = typeof id === 'string' ? CN.$(id) : id;
  if (!el) { console.warn('[bind] 不存在:', id); return; }
  el.addEventListener(evt, fn);
  el.__bound = (el.__bound || 0) + 1;
};
CN.delegate = function (rootId, sel, evt, fn) {
  var root = typeof rootId === 'string' ? CN.$(rootId) : rootId;
  if (!root || root.__dg) return;
  root.__dg = true;
  root.addEventListener(evt, function (e) {
    var t = e.target.closest(sel);
    if (t && root.contains(t)) fn.call(t, e, t);
  });
};
CN.longPress = function (el, fn, ms) {
  var tm = null, fired = false;
  var st = function () { fired = false; tm = setTimeout(function () { fired = true; fn(); }, ms || 550); };
  var cx = function () { clearTimeout(tm); tm = null; };
  el.addEventListener('touchstart', st, { passive: true });
  el.addEventListener('touchmove', cx, { passive: true });
  el.addEventListener('touchend', cx);
  el.addEventListener('touchcancel', cx);
  el.addEventListener('mousedown', function (e) { if (e.button === 0) st(); });
  el.addEventListener('mouseleave', cx);
  el.addEventListener('mouseup', cx);
  el.addEventListener('contextmenu', function (e) { if (!fired) e.preventDefault(); });
};

/* ==========================================================================
   九、视图路由
   ========================================================================== */
CN.VIEW_TITLE = {
  home: '椰子音乐', search: '搜索', list: '列表',
  import: '导入', settings: '我的',
};
CN.go = function (view, back) {
  var main = CN.$('main');
  if (!main) return;
  var from = main.querySelector('.view.on');
  var to = CN.$('view' + view.charAt(0).toUpperCase() + view.slice(1));
  if (!to) return;
  if (from === to) { CN.onEnterView(view); return; }

  CN.S.view = view;

  if (from && from !== to) {
    from.classList.remove('on');
    from.classList.add(back ? 'left' : 'right');
    /* 用 visibility 而不是 display 收起：
       display:none 会让元素退出布局，导致退场动画失效、
       且和 enterView 里的显隐设置打架（曾出现"切过去仍然看不见"）。 */
    from.style.visibility = 'hidden';
    from.style.pointerEvents = 'none';
  }
  to.classList.remove('left', 'right');
  to.style.visibility = 'visible';
  to.style.pointerEvents = '';
  void to.offsetWidth;                 /* 强制回流让过渡生效 */
  to.classList.add('on');

  CN.syncTab();
  CN.syncTop();
  CN.onEnterView(view);

  var sc = to.querySelector('.scroll');
  if (sc) sc.scrollTop = 0;
};

/** 进入某个视图时触发它的渲染 */
CN.onEnterView = function (view) {
  if (view === 'settings') {
    if (CN.renderSettings) CN.renderSettings();
  } else if (view === 'search') {
    if (CN.renderHistChips) CN.renderHistChips();
    if (!CN.__clipChecked) { CN.__clipChecked = true; if (CN.checkClipboard) CN.checkClipboard(); }
  } else if (view === 'import') {
    if (CN.checkClipboard) CN.checkClipboard();
  } else if (view === 'home') {
    if (CN.renderHome) CN.renderHome();
  }
  /* list 由 openList() 负责渲染 */
};

CN.back = function () {
  if (CN.sheetOpen()) { CN.closeSheet(); return; }
  if (CN.S.ppageOpen) { CN.closePlayer(); return; }
  if (CN.S.view !== 'home') CN.go('home', true);
};

CN.syncTab = function () {
  var v = CN.S.view;
  var key = (v === 'list')
    ? (CN.S.listKind === 'fav' ? 'fav' : (CN.S.listKind === 'history' ? 'home' : 'home'))
    : v;
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar .tab'), function (b) {
    b.classList.toggle('on', b.dataset.view === key);
  });
};
CN.syncTop = function () {
  var t = CN.$('tbTitle');
  if (t) t.textContent = CN.S.view === 'list' ? (CN.S.listTitle || '列表') : CN.VIEW_TITLE[CN.S.view];
  var sb = CN.$('tbSearch');
  if (sb) sb.hidden = (CN.S.view === 'settings');
};

/* 顶栏滚动阴影 */
CN.watchScroll = function () {
  var sc = document.querySelector('.view.on .scroll');
  if (!sc || sc.__watched) return;
  sc.__watched = true;
  sc.addEventListener('scroll', function () {}, { passive: true });
};


/* ===== 20-player.js ===== */
/* ==========================================================================
   椰子音乐 4 · 20-player.js
   队列 / 播放状态机 / 音源懒匹配 / 歌词 / 进度 / 播放页
   --------------------------------------------------------------------------
   【核心契约，继承自旧版，一条都不能破】
     1. 外部歌单导入的占位音源（bvid = mp_<mid>）首次播放才匹配，不批量预热
     2. 凡用 song.bvid 调 某弹幕网站，必须先过 ensureSongSource（mp_xxx 是 404）
     3. 匹配失败不跳下一首（用户想听的就是这首）
     4. 不要批量预热匹配 —— 撞 某弹幕网站风控
   ========================================================================== */

/* ==========================================================================
   一、原生回调入口（原生通过 window.__native.xxx 调我们）
   ========================================================================== */
window.__native = {
  onState: function (st) {
    CN.S.state = st;
    if (st === 'playing') { CN.loadLyrics(CN.S.track); CN.tick(); }
    else CN.untick();
    CN.paint();
  },
  onTrack: function (t) {
    if (!t) return;
    CN.S.track = t;
    CN.S.cur = 0;
    CN.S.dur = Number(t.duration) || 0;
    CN.S.lyric = [];
    CN.S.lyricIdx = -1;
    /* 同步到队列，保证播放界面和队列一致 */
    if (CN.S.qIndex >= 0 && CN.S.queue[CN.S.qIndex]) {
      CN.S.queue[CN.S.qIndex] = t;
    }
    CN.paint();
  },
  onProgress: function (p) {
    CN.S.cur = p.cur || 0;
    CN.S.dur = p.dur || CN.S.dur;
    CN.syncLyric(Math.floor(CN.S.cur));
    CN.paintProgress();
  },
  onError: function (msg) {
    CN.S.state = 'error';
    CN.paint();
    CN.toast(msg || '播放出错');
  },
  /** 安全区 inset（原生注入，CSS env() 在部分 WebView 上不可靠）*/
  onInsets: function (t, b, l, r) {
    var s = document.documentElement.style;
    s.setProperty('--sys-top', Math.max(0, t || 0) + 'px');
    s.setProperty('--sys-bot', Math.max(0, b || 0) + 'px');
    s.setProperty('--sys-left', Math.max(0, l || 0) + 'px');
    s.setProperty('--sys-right', Math.max(0, r || 0) + 'px');
  },
  /** 硬件返回键 */
  onBack: function () { CN.back(); },
  /** 选了 TXT 文件 */
  onPickedTxt: function (text) {
    var inp = CN.$('impInput');
    if (inp) inp.value = text;
    CN.doImport();
  },
  /** 外部歌单导入完成 */
  onMusicImport: function (r) {
    CN.$('impProgWrap').style.display = 'none';
    CN.toast(r && r.ok ? ('已导入 ' + (r.count || 0) + ' 首') : (r && r.msg) || '导入失败');
    CN.renderHome();
  },
  /** 外部歌单导入进度 */
  onMusicProgress: function (cur, total) {
    var w = CN.$('impProgWrap');
    if (!w) return;
    w.style.display = '';
    var pct = total ? Math.round(cur / total * 100) : 0;
    CN.$('impProg').style.setProperty('--p', pct + '%');
  },
  /** 登录状态变了 */
  refreshLogin: function () { CN.refreshLogin(); CN.renderHome(); },
};

/* ==========================================================================
   二、播放控制
   ========================================================================== */
CN.setQueue = function (list, index) {
  if (!list || !list.length) return;
  CN.S.queue = list.slice();
  var i = CN.clamp(index || 0, 0, list.length - 1);
  CN.S.qIndex = i;
  CN.S.track = list[i];
  CN.S.cur = 0;
  CN.S.dur = Number(list[i].duration) || 0;
  CN.S.lyric = [];
  CN.S.lyricIdx = -1;
  CN.api.addHistory(list[i]);
  CN.play();
};

CN.play = function () {
  var t = CN.S.track;
  if (!t) { CN.toast('还没有可播放的歌曲'); return; }

  CN.S.state = 'loading';
  CN.paint();

  /* 【契约 2】占位音源必须先补源，否则传给原生的是 mp_xxx */
  CN.ensureSongSource(t).then(function (ok) {
    if (!ok) {
      CN.S.state = 'error';
      CN.paint();
      CN.toast('没找到可播音源，可在播放页点「换源」自己挑一个');
      return;
    }
    /* 交给原生播放 */
    if (CN.N.has('playQueue')) {
      CN.N.call('playQueue', JSON.stringify(CN.S.queue), CN.S.qIndex);
    } else if (CN.N.has('toggle')) {
      CN.N.call('toggle');
    }
  });
};

CN.toggle = function () {
  CN.S.state === 'playing' ? CN.pause() : CN.N.call('toggle');
};
CN.pause  = function () { CN.N.call('toggle'); };
CN.next   = function () { CN.N.call('next'); };
CN.prev   = function () {
  /* 超过 3 秒先回开头 —— 与旧版一致的习惯 */
  if (CN.S.cur > 3) CN.N.call('seek', 0);
  else CN.N.call('prev');
};
CN.seek   = function (s) { CN.N.call('seek', s); };
CN.nextMode = function () {
  var order = ['list', 'single', 'random'];
  var i = order.indexOf(CN.S.mode);
  var next = order[(i + 1) % 3];
  CN.setMode(next);
  CN.toast(CN.MODE[next].text);
  CN.paint();
};
CN.setMode = function (m) {
  CN.S.mode = m;
  CN.api.setSetting('playMode', m);       /* 持久化：旧版存了不读回 */
};
CN.setLoud = function (on) {
  CN.S.loud = !!on;
  CN.N.call('setLoudness', !!on);
  CN.api.setSetting('loudness', !!on);    /* 持久化：旧版只调不存 */
  CN.paint();
};
CN.enqueueNext = function (song) {
  CN.N.call('enqueueNext', JSON.stringify(song));
  CN.toast('已插入下一首播放');
};

/* ==========================================================================
   三、音源懒匹配（契约 1/2/3）
   ========================================================================== */
CN.ensureSongSource = function (song) {
  if (!CN.isUnmatched(song)) return Promise.resolve(true);

  var kw = CN.cleanQuery(CN.songTitle(song) + ' ' + CN.songArtist(song));

  return CN.http.match(CN.songTitle(song), CN.songArtist(song), song.duration)
    .then(function (r) {
      if (r && r.ok && r.item && r.item.bvid) {
        var old = song.bvid;
        song.bvid = r.item.bvid;
        song.cid = r.item.cid;
        song.cover = r.item.cover || song.cover;
        song.unmatched = false;
        CN.syncQueueSource(old, song);
        return true;
      }
      return false;
    })
    .catch(function () { return false; });
};

/** 换源后同步队列里所有同条目 */
CN.syncQueueSource = function (oldBvid, fresh) {
  if (!oldBvid) return;
  CN.S.queue.forEach(function (x, i) {
    if (x.bvid === oldBvid) {
      CN.S.queue[i] = fresh;
      if (i === CN.S.qIndex) CN.S.track = fresh;
    }
  });
  /* 原生侧批量回写 */
  if (CN.N.has('fixSongSource')) CN.N.call('fixSongSource', 'all', '', oldBvid, '');
};

CN.cleanQuery = function (s) {
  return String(s || '')
    .replace(/[\[（(【].{0,12}[\]）)】]/g, ' ')
    .replace(/\b(official|lyric|lyrics|video|audio|mv|remaster(ed)?|hd|hq|4k|完整版|官方|高清|无损|现场版|伴奏)\b/gi, ' ')
    .replace(/\s+/g, ' ').trim();
};

/* ==========================================================================
   四、歌词
   ========================================================================== */
CN.loadLyrics = function (song) {
  if (!song) return;
  if (CN.isUnmatched(song)) { CN.noLyric(); return; }   /* 契约 2 */

  var want = song.bvid;
  CN.http.lyric(song.bvid, song.cid).then(function (r) {
    /* 过期响应丢弃：切歌后回来的旧歌词不渲染 */
    if (!CN.S.track || CN.S.track.bvid !== want) return;
    if (r && r.ok && r.lyric && r.lyric.length) {
      CN.S.lyric = r.lyric;
      CN.S.lyricIdx = -1;
      CN.renderLyric();
      CN.syncLyric(Math.floor(CN.S.cur));
    } else CN.noLyric();
  });
};

CN.noLyric = function () {
  CN.S.lyric = [];
  CN.S.lyricIdx = -1;
  var el = CN.$('ppLyric');
  if (el) el.innerHTML = '<div class="pp-lyric-msg">纯音乐，请欣赏</div>';
  var ml = CN.$('miniLyric');
  if (ml) ml.textContent = '';
};

CN.renderLyric = function () {
  var el = CN.$('ppLyric');
  if (!el) return;
  el.style.transform = 'translateY(0)';
  el.innerHTML = CN.S.lyric.map(function (l, i) {
    return '<div class="pp-lyric-line" data-i="' + i + '">' + CN.esc(l.text || '…') + '</div>';
  }).join('');
};

CN.syncLyric = function (sec) {
  if (!CN.S.lyric.length) return;
  var idx = -1;
  for (var i = 0; i < CN.S.lyric.length; i++) {
    if (CN.S.lyric[i].time <= sec) idx = i; else break;
  }
  if (idx === CN.S.lyricIdx) return;
  CN.S.lyricIdx = idx;

  Array.prototype.forEach.call(
    document.querySelectorAll('#ppLyric .pp-lyric-line'),
    function (el, i) { el.classList.toggle('on', i === idx); }
  );

  /* 居中：当前行大致居中，不做平滑跟随（避免抖动）*/
  var box = document.querySelector('.pp-lyricbox');
  var cur = document.querySelector('#ppLyric .pp-lyric-line.on');
  if (box && cur) {
    var list = CN.$('ppLyric');
    var target = cur.offsetTop - box.clientHeight / 2 + cur.offsetHeight / 2;
    list.style.transform = 'translateY(' + (-target) + 'px)';
  }

  var ml = CN.$('miniLyric');
  if (ml && idx >= 0) ml.textContent = (CN.S.lyric[idx].text || '').trim();
};

/* ==========================================================================
   五、进度 tick（App 内由原生 onProgress 驱动；
   浏览器预览时才用本地计时器）
   ========================================================================== */
CN.tickTimer = null;
CN.tick = function () {
  CN.untick();
  if (CN.N.has('playQueue')) return;      /* App 内靠原生回调，不用自己转 */
  CN.tickTimer = setInterval(function () {
    if (CN.S.state !== 'playing') return;
    CN.S.cur += 0.5;
    if (CN.S.dur && CN.S.cur >= CN.S.dur) { CN.next(); return; }
    CN.syncLyric(Math.floor(CN.S.cur));
    CN.paintProgress();
  }, 500);
};
CN.untick = function () {
  if (CN.tickTimer) { clearInterval(CN.tickTimer); CN.tickTimer = null; }
};

/* 拖动限流 80ms */
var seekThrottle = null;
CN.seekByRatio = function (r) {
  var sec = CN.clamp(r, 0, 1) * (CN.S.dur || 0);
  CN.S.cur = sec;
  CN.syncLyric(Math.floor(sec));
  if (seekThrottle) return;
  seekThrottle = setTimeout(function () {
    seekThrottle = null;
    CN.seek(sec);
    CN.paintProgress();
  }, 80);
};

/* ==========================================================================
   六、界面同步
   ========================================================================== */
CN.ratio = function () {
  if (!CN.S.dur) return 0;
  return CN.clamp(CN.S.cur / CN.S.dur, 0, 1);
};

/** 收藏状态单一真相 —— 旧版三处图标各画各的，切歌后状态骗人 */
CN.paintFav = function () {
  var on = !!(CN.S.track && CN.S.favs.has(CN.S.track.bvid));
  ['miniFav', 'ppFav'].forEach(function (id) {
    var el = CN.$(id);
    if (el) el.classList.toggle('on', on);
  });
  var f = document.querySelector('#ppFav svg');
  if (f) f.setAttribute('fill', on ? 'currentColor' : 'none');
};

CN.favTap = function () {
  var t = CN.S.track;
  if (!t) { CN.toast('还没有在播放的歌曲'); return; }
  var now = CN.api.toggleFavorite(t);
  CN.paintFav();
  CN.toast(now ? '已收藏' : '已取消收藏');
};

/** 只刷进度相关的（onProgress 高频调用，不能全量重绘）*/
CN.paintProgress = function () {
  var pct = CN.ratio() * 100 + '%';
  var mini = CN.$('miniProg');
  if (mini) mini.style.setProperty('--p', pct);
  var fill = CN.$('ppFill');
  if (fill) fill.style.setProperty('--p', pct);
  var tr = CN.$('ppTrack');
  if (tr) tr.setAttribute('aria-valuenow', Math.round(CN.ratio() * 100));
  var c = CN.$('ppCur');
  if (c) c.textContent = CN.fmt(CN.S.cur);
  var d = CN.$('ppDur');
  if (d) d.textContent = CN.fmt(CN.S.dur);
};

/** 全量重绘（切歌/状态变化时）*/
CN.paint = function () {
  var t = CN.S.track;
  var st = CN.S.state;
  var u = CN.coverUrl(t && t.cover, 120);

  /* --- Mini --- */
  var mc = CN.$('miniCov');
  if (mc) { if (u) mc.src = u; mc.style.display = u ? '' : 'none'; }
  var mt = CN.$('miniT'), ma = CN.$('miniA');
  if (mt) mt.textContent = t ? CN.songTitle(t) : '未在播放';
  if (ma) ma.textContent = t ? CN.songArtist(t) : '—';
  var mini = CN.$('mini');
  if (mini) mini.dataset.state = st;
  CN.setIcon(CN.$('miniPlayIcon'), st === 'playing' ? 'pause' : 'play', 'svg svg-sm svg-fill');
  var app = CN.$('app');
  if (app) app.dataset.mini = t ? 'on' : 'off';

  /* --- 首页大卡 --- */
  var hn = CN.$('homeNow');
  if (hn) {
    hn.style.display = t ? '' : 'none';
    var hc = CN.$('homeNowCov');
    if (hc && u) hc.src = u;
    var ht = CN.$('homeNowT'), ha = CN.$('homeNowA');
    if (ht) ht.textContent = t ? CN.songTitle(t) : '';
    if (ha) ha.textContent = t ? CN.songArtist(t) : '';
  }

  /* --- 播放页 --- */
  var pp = CN.$('ppage');
  if (pp) {
    pp.dataset.state = st;
    var pu = CN.coverUrl(t && t.cover, 720);
    var pc = CN.$('ppCover');
    if (pc && pu) pc.src = pu;
    var pt = CN.$('ppTitle'), pa = CN.$('ppArtist');
    if (pt) pt.textContent = t ? CN.songTitle(t) : '未在播放';
    if (pa) pa.textContent = t ? CN.songArtist(t) : '—';
    var ps = CN.$('ppSrcSub');
    if (ps) ps.textContent = (t && t.bvid)
      ? (CN.isUnmatched(t) ? '音源待匹配' : '来自 某弹幕网站')
      : '—';
    CN.setIcon(CN.$('ppPlayIcon'), st === 'playing' ? 'pause' : 'play', 'svg svg-lg svg-fill');
    CN.setIcon(CN.$('ppModeIcon'), CN.MODE[CN.S.mode].icon, 'svg svg-sm');
    CN.$('ppLoud').classList.toggle('on', !!CN.S.loud);
    var hp = CN.$('homeNowPlay');
    if (hp) CN.setIcon(hp, st === 'playing' ? 'pause' : 'play', 'svg svg-fill');
  }

  CN.paintProgress();
  CN.paintFav();
  CN.markPlaying();
};

/** 列表里标记当前播放行 */
CN.markPlaying = function () {
  var bvid = CN.S.track && CN.S.track.bvid;
  Array.prototype.forEach.call(document.querySelectorAll('#songList .srow'), function (row) {
    var on = bvid && row.dataset.bvid === bvid;
    row.classList.toggle('on', !!on);
    row.dataset.state = on ? CN.S.state : '';
    var wv = row.querySelector('.wave');
    if (on && !wv) {
      var cov = row.querySelector('.srow-cover');
      if (cov) {
        var w = document.createElement('span');
        w.className = 'wave';
        w.innerHTML = '<i></i><i></i><i></i><i></i>';
        cov.parentNode.replaceChild(w, cov);
      }
    } else if (!on && wv) {
      var img = document.createElement('img');
      img.className = 'srow-cover';
      img.src = CN.coverUrl(row.dataset.cover, 120);
      img.alt = '';
      wv.parentNode.replaceChild(img, wv);
    }
  });
};

/* ==========================================================================
   七、播放页开合
   ========================================================================== */
CN.openPlayer = function () {
  if (!CN.S.track) { CN.toast('还没有在播放的歌曲'); return; }
  CN.S.ppageOpen = true;
  CN.$('ppage').classList.add('on');
  CN.$('scrim').classList.add('on');
  if (!CN.S.lyric.length) CN.loadLyrics(CN.S.track);
  CN.paint();
};
CN.closePlayer = function () {
  CN.S.ppageOpen = false;
  CN.$('ppage').classList.remove('on');
  if (!CN.sheetOpen()) CN.$('scrim').classList.remove('on');
};

/* ==========================================================================
   八、队列
   ========================================================================== */
CN.renderQueue = function (box) {
  var q = CN.S.queue;
  if (!q.length) {
    box.innerHTML = '<div class="empty">' + CN.iconSvg('list', 'svg') +
      '<span class="t-cap">播放队列是空的</span></div>';
    return;
  }
  box.innerHTML = '<div style="display:flex;align-items:center;padding:8px var(--pad) 4px">' +
      '<span class="t-cap" style="font-weight:700">播放队列 · ' + q.length + ' 首</span>' +
      '<button class="sec-more" id="qClear" style="margin-left:auto">清空</button></div>' +
    q.map(function (s, i) {
      return '<div class="srow' + (i === CN.S.qIndex ? ' on' : '') + '" data-q="' + i + '">' +
        '<span class="t-cap num" style="width:22px;flex:none;text-align:center">' + (i + 1) + '</span>' +
        '<span class="srow-txt"><span class="srow-name trunc">' + CN.esc(CN.songTitle(s)) + '</span>' +
        '<span class="t-artist trunc">' + CN.esc(CN.songArtist(s)) + '</span></span>' +
        '<span class="srow-dur">' + CN.fmt(s.duration) + '</span></div>';
    }).join('');
  var clr = CN.$('qClear');
  if (clr) clr.addEventListener('click', function (e) {
    e.stopPropagation();
    CN.S.queue = []; CN.S.qIndex = -1; CN.S.track = null;
    CN.S.state = 'idle';
    CN.paint();
    CN.closeSheet();
    CN.toast('队列已清空');
  });
};


/* ===== 30-views.js ===== */
/* ==========================================================================
   椰子音乐 4 · 30-views.js
   首页 / 搜索 / 通用列表 / 导入
   ========================================================================== */

/* ==========================================================================
   一、首页
   ========================================================================== */
CN.renderHome = function () {
  var grid = CN.$('homeGrid');
  if (!grid) return;

  var favs = CN.api.getFavorites() || [];
  var hist = CN.api.getHistory() || [];
  var dls  = CN.api.getDownloads() || [];

  /* 四入口 */
  var entries = [
    { k: 'fav',     t: '我喜欢的音乐', s: favs.length ? favs.length + ' 首' : '还没有收藏', i: 'heart',   c: '#FFE8E0', n: favs.length, first: favs[0] },
    { k: 'history', t: '最近播放',     s: hist.length ? hist.length + ' 首' : '还没有记录', i: 'history', c: '#E3EEFF', n: hist.length, first: hist[0] },
    { k: 'download',t: '已下载',       s: dls.length  ? dls.length  + ' 首' : '还没有下载', i: 'folder',  c: '#FFF3D6', n: dls.length,  first: dls[0] },
    { k: 'import',  t: '导入歌单',     s: '外部歌单 / 某弹幕网站 / TXT',                        i: 'link',    c: '#E3F7EC', n: 0 },
  ];

  /* 四入口：**横向列表式**，不是 2×2 大方块。
     【2026-10-09 用户反馈"图标大到离谱，占视野，要多留白"】
     大方块 + 满幅封面 = 视觉重量过大。这里改成
     「左小封面 + 右文字」的一行式条目，封面缩到 56px，
     整屏能多放一倍内容，留白自然就回来了。 */
  grid.style.display = 'flex';
  grid.style.flexDirection = 'column';
  grid.style.gap = '10px';

  grid.innerHTML = entries.map(function (e) {
    var cu = e.first ? CN.coverUrl(e.first.cover, 200) : '';
    /* 封面用 <img> 而不是 background-image：
       data URI（含 & 和 base64）走 CSS url() 会被转义破坏，<img> 不会。 */
    return '<div class="card card-btn ent-row" data-go="' + e.k + '">' +
      '<div class="ent-cover"' + (cu ? '' : ' style="background:' + e.c + '"') + '>' +
        (cu ? '<img src="' + CN.esc(cu) + '" alt="" loading="lazy">'
            : CN.iconSvg(e.i, 'svg svg-sm')) +
      '</div>' +
      '<div class="ent-txt">' +
        '<div class="t-name trunc">' + e.t + '</div>' +
        '<div class="t-cap trunc">' + e.s + '</div>' +
      '</div>' +
      (e.n > 0 ? '<span class="ent-play">' + CN.iconSvg('play', 'svg svg-sm svg-fill') + '</span>' : '') +
    '</div>';
  }).join('');

  /* 自建歌单 */
  var pls = CN.api.getPlaylists() || [];
  var pg = CN.$('plGrid');
  pg.innerHTML = pls.map(function (p) {
    var songs = p.songs || [];
    var first = songs[0];
    var cu = first ? CN.coverUrl(first.cover, 200) : '';
    /* 同样留白：卡片内留 12px，封面不再顶满 */
    return '<div class="card card-btn" data-pl="' + CN.esc(p.id) + '" style="width:116px;padding:10px 10px 12px;flex:none">' +
      '<div style="position:relative;width:100%;aspect-ratio:1;border-radius:var(--r-sm);' +
        'border:var(--line-w) solid var(--ink);overflow:hidden;background:var(--paper-3);display:grid;place-items:center">' +
        (cu ? '<img src="' + CN.esc(cu) + '" alt="" style="width:100%;height:100%;object-fit:cover">'
            : CN.iconSvg('music', 'svg svg-lg')) +
        (songs.length ? '<span style="position:absolute;right:5px;bottom:5px;width:28px;height:28px;' +
          'border-radius:50%;background:var(--accent);border:var(--line-w) solid var(--ink);color:#fff;' +
          'display:grid;place-items:center">' + CN.iconSvg('play', 'svg svg-sm svg-fill') + '</span>' : '') +
      '</div>' +
      '<div class="t-card trunc" style="margin-top:10px">' + CN.esc(p.name) + '</div>' +
      '<div class="t-cap" style="margin-top:2px">' + songs.length + ' 首</div>' +
    '</div>';
  }).join('');

  /* 事件委托 */
  CN.delegate('homeGrid', '[data-go]', 'click', function (e, t) { CN.openSection(t.dataset.go); });
  CN.delegate('plGrid', '[data-pl]', 'click', function (e, t) { CN.openPlaylist(t.dataset.pl); });
};

CN.openSection = function (k) {
  if (k === 'fav')      return CN.openList({ kind: 'fav', title: '我喜欢的音乐' });
  if (k === 'history')  return CN.openList({ kind: 'history', title: '最近播放' });
  if (k === 'import')   return CN.go('import');
  if (k === 'download') return CN.openList({ kind: 'download', title: '已下载' });
};

CN.openPlaylist = function (id) {
  var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === id; })[0];
  if (!p) { CN.toast('歌单不存在'); return; }
  CN.openList({ kind: 'playlist', id: id, title: p.name });
};

/* ==========================================================================
   二、通用列表
   --------------------------------------------------------------------------
   S.listKind 显式建模来源 —— 旧版「搜过一次后打开歌单被换成搜索结果」
   ========================================================================== */
CN.openList = function (o) {
  o = o || {};
  CN.S.listKind = o.kind || 'playlist';
  CN.S.listId = o.id || null;
  CN.S.listTitle = o.title || '列表';

  if (CN.S.listKind === 'fav')         CN.S.songs = (CN.api.getFavorites() || []).slice();
  else if (CN.S.listKind === 'history') CN.S.songs = (CN.api.getHistory() || []).slice();
  else if (CN.S.listKind === 'download')CN.S.songs = (CN.api.getDownloads() || []).slice();
  else if (CN.S.listKind === 'search')  CN.S.songs = (CN.S.results || []).slice();
  else {
    var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === CN.S.listId; })[0];
    CN.S.songs = p ? (p.songs || []).slice() : [];
  }
  CN.go('list');
  CN.renderList();
};

CN.renderList = function () {
  var box = CN.$('songList');
  if (!box) return;
  var list = CN.S.songs || [];

  CN.$('listTitle').textContent = CN.S.listTitle || '列表';
  var sub;
  if (CN.S.listKind === 'fav')      sub = list.length ? list.length + ' 首' : '还没有收藏';
  else if (CN.S.listKind === 'history') sub = list.length ? '最近 ' + list.length + ' 首' : '还没有播放记录';
  else if (CN.S.listKind === 'search')  sub = list.length ? '找到 ' + list.length + ' 条' : '没有结果';
  else sub = list.length + ' 首';
  CN.$('listSub').textContent = sub;

  var cov = CN.$('listCover');
  var cu = list.length ? CN.coverUrl(list[0].cover, 300) : '';
  if (cu) { cov.src = cu; cov.style.visibility = ''; }
  else { cov.removeAttribute('src'); cov.style.visibility = 'hidden'; }

  if (!list.length) {
    box.innerHTML = '<div class="empty">' + CN.iconSvg('music', 'svg') +
      '<span class="t-cap">' + CN.emptyHint() + '</span></div>';
    CN.$('songFoot').innerHTML = '';
    return;
  }

  var cur = CN.S.track && CN.S.track.bvid;
  /* 歌曲行结构对标 某音乐平台：
     封面在左 → 两位大序号（01./02.）→ 歌名+歌手 → 右侧 ⋮
     当前播放行：序号与歌名一起变强调色。 */
  box.innerHTML = list.map(function (s, i) {
    var on = cur && s.bvid === cur;
    var u = CN.coverUrl(s.cover, 120);
    var cell = on
      ? '<span class="wave"><i></i><i></i><i></i><i></i></span>'
      : (u ? '<img class="srow-cover" src="' + CN.esc(u) + '" alt="" loading="lazy">'
           : '<span class="srow-cover"></span>');
    var no = (i + 1 < 10 ? '0' : '') + (i + 1);
    return '<div class="srow' + (on ? ' on' : '') + '" data-i="' + i + '" data-bvid="' +
      CN.esc(s.bvid || '') + '" data-cover="' + CN.esc(u) + '" data-state="' +
      (on ? CN.S.state : '') + '">' +
      cell +
      '<span class="srow-no">' + no + '</span>' +
      '<span class="srow-txt">' +
        '<span class="srow-name trunc">' + CN.esc(CN.songTitle(s)) + '</span>' +
        '<span class="t-artist trunc">' + CN.esc(CN.songArtist(s)) +
          (CN.isUnmatched(s) ? ' · 待匹配' : '') + '</span>' +
      '</span>' +
      '<span class="srow-dur">' + CN.fmt(s.duration) + '</span>' +
      '<button class="srow-more" data-more="' + i + '" aria-label="更多">' +
        CN.iconSvg('more', 'svg svg-sm') + '</button>' +
    '</div>';
  }).join('');

  /* 底部 */
  var foot = CN.$('songFoot');
  if (CN.S.listKind === 'search' && CN.S.hasMore) {
    foot.innerHTML = '<button class="btn btn-block" id="loadMore" style="margin-top:var(--gap)">加载更多</button>';
    CN.on('loadMore', 'click', function () { CN.S.page++; CN.runSearch(CN.S.kw, true); });
  } else if (CN.S.listKind === 'playlist' || CN.S.listKind === 'fav') {
    foot.innerHTML = '<button class="btn btn-block" id="favAllBtn" style="margin-top:var(--gap)">收藏全部</button>';
    CN.on('favAllBtn', 'click', CN.favAll);
  } else foot.innerHTML = '';
};

CN.emptyHint = function () {
  if (CN.S.listKind === 'fav')      return '还没有收藏\n在歌曲上点 ♡ 就会出现在这里';
  if (CN.S.listKind === 'history')  return '还没有播放记录';
  if (CN.S.listKind === 'download') return '还没有下载的歌曲';
  if (CN.S.listKind === 'search')   return '没找到相关歌曲\n换个词试试';
  return '这个歌单还没有歌曲';
};

CN.refreshList = function () {
  if (CN.S.view !== 'list') return;
  if (CN.S.listKind === 'playlist' && CN.S.listId) {
    var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === CN.S.listId; })[0];
    if (p) { CN.S.songs = (p.songs || []).slice(); CN.renderList(); }
  } else if (CN.S.listKind === 'fav') {
    CN.S.songs = (CN.api.getFavorites() || []).slice();
    CN.renderList();
  }
};

CN.favAll = function () {
  var list = CN.S.songs || [];
  if (!list.length) { CN.toast('列表是空的'); return; }
  var n = 0;
  list.forEach(function (s) {
    if (!CN.S.favs.has(s.bvid)) { CN.api.toggleFavorite(s); n++; }
  });
  CN.paintFav();
  CN.toast(n ? '已收藏 ' + n + ' 首' : '都已经收藏过了');
};

/* ==========================================================================
   三、搜索
   ========================================================================== */
CN.HIST_KEY = 'coconut4_search_history';
CN.histWords = function () {
  try { return JSON.parse(localStorage.getItem(CN.HIST_KEY)) || []; } catch (e) { return []; }
};
CN.pushHist = function (w) {
  w = String(w || '').trim();
  if (!w) return;
  var l = CN.histWords().filter(function (x) { return x !== w; });
  l.unshift(w);
  if (l.length > 12) l.length = 12;      /* 旧版上限 12，保留 */
  try { localStorage.setItem(CN.HIST_KEY, JSON.stringify(l)); } catch (e) {}
  CN.renderHistChips();
};
CN.clearHist = function () {
  try { localStorage.removeItem(CN.HIST_KEY); } catch (e) {}
  CN.renderHistChips();
};
CN.renderHistChips = function () {
  var box = CN.$('histChips');
  if (!box) return;
  var w = CN.histWords();
  CN.$('histSec').hidden = !w.length;
  box.innerHTML = w.map(function (x) {
    return '<button class="chip" data-kw="' + CN.esc(x) + '">' + CN.esc(x) + '</button>';
  }).join('');
};

CN.debouncedSearch = CN.debounce(function (kw) { CN.runSearch(kw, false); }, 450);

CN.runSearch = function (kw, append) {
  kw = String(kw || '').trim();
  if (!kw) return;
  CN.S.kw = kw;
  if (!append) { CN.S.page = 1; CN.S.results = []; }

  var body = CN.$('searchBody');
  if (!append && body) body.innerHTML =
    '<div class="empty"><div class="spinner"></div><span class="t-cap">搜索中…</span></div>';

  CN.http.search(kw, CN.S.page).then(function (r) {
    if (r && r.ok && r.list) {
      CN.S.results = append ? CN.S.results.concat(r.list) : r.list.slice();
      CN.S.hasMore = !!r.hasMore;
      if (!append) CN.pushHist(kw);
      CN.openList({ kind: 'search', title: '“' + kw + '”' });
    } else {
      CN.S.results = append ? CN.S.results : [];
      CN.S.hasMore = false;
      CN.openList({ kind: 'search', title: '“' + kw + '”' });
      if (!append) CN.toast('没搜到，试试别的词');
    }
  });
};

/* ==========================================================================
   四、导入
   ========================================================================== */
CN.doImport = function () {
  var inp = CN.$('impInput');
  var text = (inp.value || '').trim();
  if (!text) { CN.toast('先粘贴一个链接'); return; }

  /* 椰子分享文本（base64 JSON）*/
  var wrapped = null;
  try { wrapped = JSON.parse(atob(text)); } catch (e) {}
  if (wrapped && wrapped.songs) {
    var pl = CN.api.createPlaylist(wrapped.name || '导入的歌单');
    if (!pl) { CN.toast('建歌单失败'); return; }
    CN.api.addManyToPlaylist(pl.id, wrapped.songs);
    CN.toast('已导入 ' + wrapped.songs.length + ' 首');
    CN.renderHome();
    return;
  }

  var box = CN.$('impResult');
  var isMusicPlatform = /music\.example\.com|某音乐平台/i.test(text);
  var isBili = /example\.com|link\.example\.com|bv[0-9A-Za-z]{10}|av\d+/i.test(text);

  if (isMusicPlatform) {
    box.innerHTML = '<div class="card" style="padding:var(--pad)"><div class="hand" style="font-size:1.375rem">正在读取外部歌单…</div>' +
      '<div class="t-cap" style="margin-top:4px">只导入条目，音源在首次播放时匹配</div></div>';
    CN.$('impProgWrap').style.display = '';
    CN.$('impProg').style.setProperty('--p', '25%');
    CN.api.importMusicPlaylist(text);
    return;
  }
  if (isBili) {
    box.innerHTML = '<div class="card" style="padding:var(--pad)"><div class="hand" style="font-size:1.375rem">正在识别 某弹幕网站链接…</div></div>';
    CN.$('impProgWrap').style.display = '';
    CN.$('impProg').style.setProperty('--p', '40%');
    CN.api.importLink(text);
    return;
  }
  CN.$('impProgWrap').style.display = 'none';
  CN.toast('没认出这个链接，试试外部歌单或某弹幕网站链接');
};

/** 剪贴板自动检测（只在导入页做）*/
CN.checkClipboard = function () {
  var box = CN.$('importBanner');
  if (!box) return;
  var txt = CN.api.getClipboard();
  var looks = txt && txt.length >= 8 &&
    /music\.example\.com|example\.com|link\.example\.com|bv[0-9A-Za-z]{10}|某音乐平台/.test(txt);

  if (!looks) {
    box.innerHTML = '';
    CN.$('tabDot').hidden = true;
    return;
  }
  box.innerHTML = '<div class="card" style="padding:var(--gap);display:flex;align-items:center;gap:var(--gap);' +
    'background:var(--accent-soft)">' + CN.iconSvg('link', 'svg') +
    '<span class="t-cap trunc" style="flex:1 1 0">剪贴板里有个音乐链接</span>' +
    '<button class="btn btn-sm btn-fill" id="clipUse">用这个</button></div>';
  CN.$('tabDot').hidden = false;
  CN.on('clipUse', 'click', function () {
    CN.$('impInput').value = txt;
    CN.doImport();
    box.innerHTML = '';
    CN.$('tabDot').hidden = true;
  });
};


/* ===== 40-sheets.js ===== */
/* ==========================================================================
   椰子音乐 4 · 40-sheets.js
   歌曲操作 / 歌单管理 / 换源 / 队列 / 详情 / 选择器
   ========================================================================== */

/* ==========================================================================
   一、歌曲操作
   ========================================================================== */
CN.openSongSheet = function (song, idx) {
  if (!song) return;
  var isFav = CN.S.favs.has(song.bvid);
  var inPl = CN.S.listKind === 'playlist' && CN.S.listId;

  var hero = CN.coverUrl(song.cover, 160) ?
    '<img src="' + CN.esc(CN.coverUrl(song.cover, 160)) + '" alt="">' +
    '<div style="flex:1 1 0;min-width:0">' +
    '<div class="hand trunc" style="font-size:1.25rem">' + CN.esc(CN.songTitle(song)) + '</div>' +
    '<div class="t-cap trunc">' + CN.esc(CN.songArtist(song)) + '</div></div>' : '';

  var html = '';
  html += '<button class="sitem" data-a="play">' + CN.iconSvg('play') +
    '<span class="sitem-txt">立即播放</span></button>';
  html += '<button class="sitem" data-a="next">' + CN.iconSvg('list') +
    '<span class="sitem-txt">下一首播放</span></button>';
  html += '<button class="sitem" data-a="fav">' + CN.iconSvg('heart') +
    '<span class="sitem-txt">' + (isFav ? '取消收藏' : '收藏') + '</span></button>';
  html += '<button class="sitem" data-a="add">' + CN.iconSvg('add') +
    '<span class="sitem-txt">加入歌单</span></button>';
  html += '<button class="sitem" data-a="download">' + CN.iconSvg('download') +
    '<span class="sitem-txt">下载到本地</span></button>';
  if (CN.isUnmatched(song)) {
    html += '<button class="sitem" data-a="swap">' + CN.iconSvg('swap') +
      '<span class="sitem-txt">换个音源<span class="sitem-sub">这首还没匹配到音源</span></span></button>';
  }
  html += '<button class="sitem" data-a="detail">' + CN.iconSvg('info') +
    '<span class="sitem-txt">歌曲详情</span></button>';
  if (inPl) {
    html += '<button class="sitem danger" data-a="del">' + CN.iconSvg('trash') +
      '<span class="sitem-txt">从歌单移除</span></button>';
  }

  CN.swapTarget = song;
  CN.swapIndex = idx;

  CN.openSheet('歌曲操作', {
    hero: hero,
    html: html,
    onMount: function (body) {
      body.addEventListener('click', function (e) {
        var b = e.target.closest('[data-a]');
        if (!b) return;
        var a = b.dataset.a;
        if (a === 'play')        { CN.closeSheet(); CN.setQueue(CN.S.songs, idx); }
        else if (a === 'next')  { CN.closeSheet(); CN.enqueueNext(song); }
        else if (a === 'fav')   {
          var now = CN.api.toggleFavorite(song);
          CN.paintFav(); CN.closeSheet(); CN.refreshList();
          CN.toast(now ? '已收藏' : '已取消收藏');
        }
        else if (a === 'add')      { CN.openPickSheet(song); }
        else if (a === 'download') { CN.closeSheet(); CN.api.download(song); CN.toast('已加入下载队列'); }
        else if (a === 'swap')     { CN.closeSheet(); CN.openSwapSheet(song); }
        else if (a === 'detail')   { CN.closeSheet(); CN.openDetailSheet(song); }
        else if (a === 'del')      { CN.removeFrom(song, idx); CN.closeSheet(); }
      });
    },
  });
};

CN.removeFrom = function (song, idx) {
  if (CN.S.listKind !== 'playlist' || !CN.S.listId) return;
  CN.api.removeSongAt(CN.S.listId, song.bvid, idx);
  CN.S.songs.splice(idx, 1);
  CN.refreshList();
  CN.renderHome();
  CN.toast('已移除');
};

/* ==========================================================================
   二、加入歌单
   ========================================================================== */
CN.openPickSheet = function (song) {
  var pls = CN.api.getPlaylists() || [];
  var html = pls.map(function (p) {
    var has = (p.songs || []).some(function (s) { return s.bvid === song.bvid; });
    return '<button class="sitem' + (has ? ' on' : '') + '" data-p="' + CN.esc(p.id) + '" data-has="' + has + '">' +
      CN.iconSvg(has ? 'check' : 'music') +
      '<span class="sitem-txt">' + CN.esc(p.name) +
      '<span class="sitem-sub">' + (p.songs || []).length + ' 首' +
      (has ? ' · 已在里面' : '') + '</span></span></button>';
  }).join('');
  html += '<button class="sitem" data-new="1">' + CN.iconSvg('add') +
    '<span class="sitem-txt">新建歌单并加入</span></button>';

  CN.openSheet('加入歌单', {
    html: html,
    onMount: function (body) {
      body.addEventListener('click', function (e) {
        if (e.target.closest('[data-new]')) { CN.newPlaylistSheet(song); return; }
        var b = e.target.closest('[data-p]');
        if (!b) return;
        if (b.dataset.has === 'true') { CN.toast('已经在这个歌单里了'); return; }
        CN.api.addToPlaylist(b.dataset.p, song);
        CN.closeSheet();
        CN.renderHome();
        CN.toast('已加入');
      });
    },
  });
};

CN.newPlaylistSheet = function (track) {
  CN.openSheet('新建歌单', {
    html: '<div style="padding:var(--pad)"><div class="searchbox">' +
      '<input id="newPlName" placeholder="歌单名字" autocomplete="off" enterkeyhint="done"></div></div>',
    foot: '<button class="btn btn-fill btn-block" id="newPlOk">创建</button>',
    onMount: function () {
      var inp = CN.$('newPlName');
      setTimeout(function () { inp.focus(); }, 280);
      var ok = function () {
        var n = (inp.value || '').trim();
        if (!n) { CN.toast('起个名字吧'); return; }
        var p = CN.api.createPlaylist(n);
        if (!p) { CN.toast('创建失败'); return; }
        if (track) CN.api.addToPlaylist(p.id, track);
        CN.closeSheet();
        CN.renderHome();
        CN.toast('已创建「' + n + '」');
      };
      CN.on('newPlOk', 'click', ok);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); });
    },
  });
};

/* ==========================================================================
   三、歌单管理
   ========================================================================== */
CN.openPlaylistOps = function (pid) {
  var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === pid; })[0];
  if (!p) return;
  var n = (p.songs || []).length;

  var html = '<button class="sitem" data-a="play">' + CN.iconSvg('play') +
    '<span class="sitem-txt">播放全部<span class="sitem-sub">' + n + ' 首</span></span></button>';
  html += '<button class="sitem" data-a="share">' + CN.iconSvg('share') +
    '<span class="sitem-txt">分享歌单<span class="sitem-sub">复制成一段文本</span></span></button>';
  if (!p.fixed) {
    html += '<button class="sitem" data-a="rename">' + CN.iconSvg('text') +
      '<span class="sitem-txt">重命名</span></button>';
    html += '<button class="sitem danger" data-a="del">' + CN.iconSvg('trash') +
      '<span class="sitem-txt">删除歌单<span class="sitem-sub">连同 ' + n + ' 首一起删除</span></span></button>';
  }

  CN.plOps = pid;
  CN.openSheet(p.name, {
    html: html,
    onMount: function (body) {
      body.addEventListener('click', function (e) {
        var b = e.target.closest('[data-a]');
        if (!b) return;
        var a = b.dataset.a;
        if (a === 'play')  { CN.closeSheet(); if (n) CN.setQueue(p.songs, 0); else CN.toast('歌单是空的'); }
        else if (a === 'share')  { CN.sharePlaylist(pid); CN.closeSheet(); }
        else if (a === 'rename') { CN.renameSheet(pid); }
        else if (a === 'del')    { CN.confirmDelete(pid); }
      });
    },
  });
};

CN.renameSheet = function (pid) {
  var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === pid; })[0];
  CN.openSheet('重命名歌单', {
    html: '<div style="padding:var(--pad)"><div class="searchbox">' +
      '<input id="rnName" value="' + CN.esc(p ? p.name : '') + '" autocomplete="off" enterkeyhint="done"></div></div>',
    foot: '<button class="btn btn-fill btn-block" id="rnOk">保存</button>',
    onMount: function () {
      var inp = CN.$('rnName');
      setTimeout(function () { inp.focus(); inp.select(); }, 280);
      var ok = function () {
        var n = (inp.value || '').trim();
        if (!n) { CN.toast('名字不能为空'); return; }
        CN.api.renamePlaylist(pid, n);
        CN.closeSheet();
        if (CN.S.listKind === 'playlist' && CN.S.listId === pid) {
          CN.S.listTitle = n; CN.renderList(); CN.syncTop();
        }
        CN.renderHome();
        CN.toast('已重命名');
      };
      CN.on('rnOk', 'click', ok);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); });
    },
  });
};

CN.sharePlaylist = function (pid) {
  var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === pid; })[0];
  if (!p) return;
  var lines = ['【椰子音乐】' + p.name];
  (p.songs || []).forEach(function (s, i) {
    lines.push((i + 1) + '. ' + CN.songTitle(s) + ' — ' + CN.songArtist(s));
  });
  var text = lines.join('\n');

  var ex = CN.api.exportPlaylistTxt(pid);
  if (ex && ex.uri && CN.api.shareFile(ex.uri, ex.name || (p.name + '.txt'))) {
    CN.toast('已打开分享'); return;
  }
  if (CN.api.shareText(text)) { CN.toast('已打开分享'); return; }
  CN.api.copyText(text);
  CN.toast('歌单已复制，粘贴给朋友就行');
};

CN.confirmDelete = function (pid) {
  var p = (CN.api.getPlaylists() || []).filter(function (x) { return x.id === pid; })[0];
  if (!p) return;
  CN.openSheet('删除歌单', {
    html: '<div style="padding:var(--gap-xl) var(--pad);text-align:center">' +
      '<div class="hand" style="font-size:1.75rem">删除「' + CN.esc(p.name) + '」？</div>' +
      '<div class="t-cap" style="margin-top:8px">' + (p.songs || []).length +
      ' 首会一起消失，删了找不回来</div></div>',
    foot: '<div style="display:flex;gap:var(--gap)">' +
      '<button class="btn" style="flex:1" id="delNo">取消</button>' +
      '<button class="btn btn-fill" style="flex:1;background:#E5484D" id="delYes">删除</button></div>',
    onMount: function () {
      CN.on('delNo', 'click', CN.closeSheet);
      CN.on('delYes', 'click', function () {
        CN.api.deletePlaylist(pid);
        CN.closeSheet();
        if (CN.S.view === 'list') CN.go('home', true);
        CN.renderHome();
        CN.toast('已删除');
      });
    },
  });
};

/* ==========================================================================
   四、歌曲详情
   ========================================================================== */
CN.openDetailSheet = function (s) {
  var rows = [
    ['歌名', CN.songTitle(s)],
    ['歌手', CN.songArtist(s)],
    ['时长', CN.fmt(s.duration)],
    ['UP 主', s.owner || '无'],
    ['播放量', s.play ? CN.fmtPlays(s.play) : '无'],
    ['弹幕', s.danmaku != null ? s.danmaku : '无'],
    ['收藏', s.favorites != null ? s.favorites : '无'],
    ['来源', CN.isUnmatched(s) ? '待匹配（外部歌单导入占位）' : '某弹幕网站 ' + (s.bvid || '')],
    ['CID', s.cid || '无'],
    ['匹配分', s.score != null ? s.score : '无'],
  ];
  var html = rows.map(function (r) {
    return '<div class="sitem" style="cursor:default">' +
      '<span class="sitem-txt"><span class="t-cap">' + r[0] + '</span>' +
      '<span class="trunc" style="display:block">' + CN.esc(r[1]) + '</span></span></div>';
  }).join('');

  CN.openSheet('歌曲详情', {
    html: html,
    foot: '<button class="btn btn-block" id="dtOpen">在 某弹幕网站打开</button>',
    onMount: function () {
      CN.on('dtOpen', 'click', function () {
        if (CN.isUnmatched(s)) { CN.toast('还没匹配到音源'); return; }
        CN.api.openUrl('https://www.example.com/video/' + s.bvid);
        CN.closeSheet();
      });
    },
  });
};

/* ==========================================================================
   五、手动换源（只在用户主动点开时才搜）
   ========================================================================== */
CN.openSwapSheet = function (song) {
  var kw = CN.cleanQuery(CN.songTitle(song) + ' ' + CN.songArtist(song));
  CN.swapSong = song;

  CN.openSheet('换个音源', {
    html: '<div style="padding:var(--pad);border-bottom:2px solid var(--ink)">' +
      '<div class="searchbox"><input id="swIn" placeholder="搜歌手 + 歌名" ' +
      'value="' + CN.esc(kw) + '" autocomplete="off" enterkeyhint="search"></div>' +
      '<div class="t-cap" style="margin-top:6px">手动搜索只查这一首</div></div>' +
      '<div id="swList"></div>',
    onMount: function () {
      var doS = CN.debounce(function () { CN.swapSearch(CN.$('swIn').value); }, 450);
      CN.on('swIn', 'input', doS);
      CN.on('swIn', 'keydown', function (e) {
        if (e.key === 'Enter') CN.swapSearch(CN.$('swIn').value);
      });
      CN.swapSearch(kw);
    },
  });
};

CN.swapSearch = function (kw) {
  var box = CN.$('swList');
  if (!box) return;
  box.innerHTML = '<div class="empty"><div class="spinner"></div><span class="t-cap">找候选中…</span></div>';

  CN.http.search(kw, 1).then(function (r) {
    if (!r || !r.ok || !r.list || !r.list.length) {
      box.innerHTML = '<div class="empty">' + CN.iconSvg('search', 'svg') +
        '<span class="t-cap">没找到候选<br>换个关键词再试</span></div>';
      return;
    }
    box.innerHTML = '';
    r.list.forEach(function (item) {
      box.appendChild(CN.sItem('music',
        CN.songTitle(item) + ' — ' + CN.songArtist(item),
        CN.fmt(item.duration) + ' · ' + CN.fmtPlays(item.play) + '播放',
        function () { CN.applySwap(item); }
      ));
    });
  });
};

CN.applySwap = function (pick) {
  var old = CN.swapSong;
  if (!old) return;
  var keepCur = CN.S.cur;

  var fresh = {
    bvid: pick.bvid, cid: pick.cid,
    title: pick.title, artist: pick.artist,
    cover: pick.cover || old.cover,
    duration: pick.duration || old.duration,
    owner: pick.owner, play: pick.play, danmaku: pick.danmaku,
    favorites: pick.favorites, unmatched: false,
  };
  CN.syncQueueSource(old.bvid, fresh);
  CN.S.track = fresh;
  CN.S.cur = keepCur;

  CN.closeSheet();
  CN.loadLyrics(fresh);
  CN.paint();
  CN.refreshList();
  CN.renderHome();
  CN.toast('已换成新音源');
};

/* ==========================================================================
   六、播放队列
   ========================================================================== */
CN.openQueueSheet = function () {
  CN.openSheet('播放队列', {
    html: '<div id="qBox"></div>',
    onMount: function (body) {
      CN.renderQueue(CN.$('qBox'));
      CN.on('qBox', 'click', function (e) {
        var r = e.target.closest('[data-q]');
        if (!r) return;
        var i = Number(r.dataset.q);
        CN.S.queue = CN.S.queue;
        CN.S.qIndex = i;
        CN.S.track = CN.S.queue[i];
        CN.N.call('playQueue', JSON.stringify(CN.S.queue), i);
        CN.closeSheet();
        CN.paint();
      });
    },
  });
};

/* ==========================================================================
   七、多选器
   ========================================================================== */
CN.openPicker = function (title, opts, cur, cb) {
  var html = opts.map(function (o) {
    return '<button class="sitem' + (o.v === cur ? ' on' : '') + '" data-v="' + CN.esc(o.v) + '">' +
      CN.iconSvg(o.v === cur ? 'check' : 'rows') +
      '<span class="sitem-txt">' + CN.esc(o.n) + '</span></button>';
  }).join('');
  CN.openSheet(title, {
    html: html,
    onMount: function (body) {
      body.addEventListener('click', function (e) {
        var b = e.target.closest('[data-v]');
        if (!b) return;
        cb(b.dataset.v);
        CN.closeSheet();
      });
    },
  });
};


/* ===== 50-settings.js ===== */
/* ==========================================================================
   椰子音乐 4 · 50-settings.js
   账号 / 外观（四种皮肤 + 主题色）/ 播放 / 关于
   --------------------------------------------------------------------------
   旧版 22 项设置全部保留：
     保留 —— 主题色12色、深浅色、响度均衡、播放模式、下载目录、
             某弹幕网站登录/退出、重新检测、通知权限、关于、启动图标切换(旧版不可用)
     升级 —— 行高旋钮→列表密度3档；歌名字号旋钮→界面字号4档
     新增 —— 四种皮肤、界面字号、毛玻璃开关、重置显示设置
     删除 —— 菜单栏位置（改响应式自动切换）、首页列数（改 auto-fill）
   ========================================================================== */

CN.settings = {};

CN.loadSettings = function () {
  var s = CN.api.getSettings() || {};
  CN.settings.skin       = s.skin || 'paper';
  CN.settings.theme      = s.theme || 'paper';
  CN.settings.accent     = s.accent || '#FF6B4A';
  CN.settings.fontsize   = s.fontsize || 'm';
  CN.settings.density    = s.density || 'n';
  CN.settings.lineDouble = (s.lineDouble === undefined) ? true : !!s.lineDouble;
  CN.settings.playMode   = s.playMode || 'list';     /* 修复：旧版存了不读回 */
  CN.settings.loudness   = !!s.loudness;             /* 修复：旧版只调不存 */
  CN.settings.downloadDir = s.downloadDir || '';

  CN.S.mode = CN.settings.playMode;
  CN.S.loud = CN.settings.loudness;
  CN.applySettings();
};

CN.applySettings = function () {
  var html = document.documentElement;

  /* 皮肤 */
  html.setAttribute('data-skin', CN.settings.skin);

  /* 字号（4 档，覆盖 clamp 基准）*/
  var fs = { s: '14px', m: '15.5px', l: '17px', xl: '18.5px' }[CN.settings.fontsize] || '15.5px';
  html.style.setProperty('font-size', fs);

  /* 列表密度 → 行高令牌 */
  var rowH = { c: '54px', n: '60px', r: '70px' }[CN.settings.density] || '60px';
  html.style.setProperty('--row-h', rowH);

  /* 主题色 */
  if (CN.settings.accent) html.style.setProperty('--accent', CN.settings.accent);

  /* 线条样式：双实线（手绘叠画）/ 单实线。
     复线的 opacity 全部走 calc(var(--line-alpha) * var(--line-double))，
     这里只需切这一个变量，全站 7 处复线同时生效。 */
  html.style.setProperty('--line-double', CN.settings.lineDouble ? '1' : '0');

  /* 状态栏配色跟随皮肤。
     读计算值失败（老 WebView 不支持 getComputedStyle 或变量未落地）时
     不能让整个应用崩 —— 静默跳过，状态栏保持系统默认。 */
  try {
    if (typeof getComputedStyle === 'function') {
      var bg = getComputedStyle(html).getPropertyValue('--paper').trim();
      if (bg) CN.api.setStatusBarColor(bg);
    }
  } catch (e) {
    if (window.console) console.warn('[外观] 状态栏配色同步跳过:', e);
  }
};

CN.resetDisplay = function () {
  CN.settings.skin = 'paper';
  CN.settings.accent = '#FF6B4A';
  CN.settings.fontsize = 'm';
  CN.settings.density = 'n';
  CN.settings.lineDouble = true;
  ['skin', 'accent', 'fontsize', 'density', 'lineDouble'].forEach(function (k) {
    CN.api.setSetting(k, CN.settings[k]);
  });
  CN.applySettings();
  CN.renderSettings();
  CN.toast('显示设置已重置');
};

/* ==========================================================================
   账号
   ========================================================================== */
CN.refreshLogin = function () {
  var u = CN.api.getUname() || { logged_in: false, uname: '' };
  CN.S.login = u;
  var n = CN.$('uName'), s = CN.$('uSub'), b = CN.$('loginBtn');
  if (u.logged_in && u.uname) {
    if (n) n.textContent = u.uname;
    if (s) s.textContent = '已登录 某弹幕网站，可同步收藏';
    if (b) b.textContent = '退出';
  } else {
    if (n) n.textContent = '未登录';
    if (s) s.textContent = '登录后可同步 某弹幕网站收藏';
    if (b) b.textContent = '登录';
  }
};

/* ==========================================================================
   行构造器
   ========================================================================== */
function rowTap(icon, title, sub, value, fn) {
  var el = document.createElement('div');
  el.className = 'srow-set';
  el.setAttribute('role', 'button');
  el.tabIndex = 0;
  el.innerHTML =
    '<span class="srow-set-ico">' + CN.iconSvg(icon) + '</span>' +
    '<span class="srow-set-txt"><div class="srow-name">' + title + '</div>' +
    (sub ? '<div class="t-cap">' + sub + '</div>' : '') + '</span>' +
    (value ? '<span class="srow-set-val">' + CN.esc(value) + '</span>' : '') +
    CN.iconSvg('next', 'svg svg-sm');
  var go = function () { fn(); };
  el.addEventListener('click', go);
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
  });
  return el;
}

function rowSwitch(icon, title, sub, on, fn) {
  var el = document.createElement('div');
  el.className = 'srow-set';
  el.setAttribute('role', 'switch');
  el.tabIndex = 0;
  el.innerHTML =
    '<span class="srow-set-ico">' + CN.iconSvg(icon) + '</span>' +
    '<span class="srow-set-txt"><div class="srow-name">' + title + '</div>' +
    (sub ? '<div class="t-cap">' + sub + '</div>' : '') + '</span>' +
    '<span class="switch" aria-checked="' + (on ? 'true' : 'false') + '"></span>';
  var sw = el.querySelector('.switch');
  var tg = function () {
    var now = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', now ? 'true' : 'false');
    fn(now);
  };
  el.addEventListener('click', tg);
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tg(); }
  });
  return el;
}
